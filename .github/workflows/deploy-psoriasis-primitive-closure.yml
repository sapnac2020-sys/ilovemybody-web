name: Deploy Phase 116 psoriasis primitive closure

on:
  workflow_dispatch:
    inputs:
      phase115_verified:
        description: 'Type VERIFIED after Phase 115 master formula verifier has passed in production'
        required: true
        type: string

jobs:
  deploy:
    if: ${{ inputs.phase115_verified == 'VERIFIED' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate files
        run: |
          test -f backend/phase_116_psoriasis_primitive_closure.sql
          test -f ops/verify-psoriasis-primitive-closure.php
          php -l ops/verify-psoriasis-primitive-closure.php
      - name: Upload SQL and verifier
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "backend/phase_116_psoriasis_primitive_closure.sql,ops/verify-psoriasis-primitive-closure.php"
          target: ${{ secrets.HOSTINGER_APP_PATH }}
      - name: Run production verifier
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd "${{ secrets.HOSTINGER_APP_PATH }}"
            php ops/verify-psoriasis-primitive-closure.php | tee latest-phase116-proof.json
            grep -q '"ok": true' latest-phase116-proof.json
