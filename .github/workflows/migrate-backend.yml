name: Migrate I Love My Body Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/phase_42_pre10_clarity_engine.sql
      - backend/phase_42b_pre10_choice_library.sql
      - backend/phase_42c_pre10_calculation_contract.sql
      - backend/phase_43_backend_driven_app_flow.sql
      - backend/phase_44_canonical_backend_freeze.sql
      - backend/phase_46_remove_redikall_pilot.sql
      - .github/workflows/migrate-backend.yml

concurrency:
  group: ilovemybody-backend
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration files
        id: validate
        run: |
          set -euo pipefail
          test -s backend/phase_42_pre10_clarity_engine.sql
          test -s backend/phase_42b_pre10_choice_library.sql
          test -s backend/phase_42c_pre10_calculation_contract.sql
          test -s backend/phase_43_backend_driven_app_flow.sql
          test -s backend/phase_44_canonical_backend_freeze.sql
          test -s backend/phase_46_remove_redikall_pilot.sql
          grep -q 'CREATE TABLE IF NOT EXISTS `ilb_pre10_dimension`' backend/phase_42_pre10_clarity_engine.sql
          grep -q 'INSERT INTO `ilb_pre10_option`' backend/phase_42b_pre10_choice_library.sql
          grep -q 'CREATE VIEW `v_ilb_backend_readiness`' backend/phase_42c_pre10_calculation_contract.sql
          grep -q 'CREATE VIEW `v_ilb_app_flow_contract`' backend/phase_43_backend_driven_app_flow.sql
          grep -q 'CREATE TABLE IF NOT EXISTS `ilb_backend_release`' backend/phase_44_canonical_backend_freeze.sql
          grep -q 'DROP TABLE IF EXISTS `ilb_energy_map_system`' backend/phase_46_remove_redikall_pilot.sql
          sha256sum backend/phase_42*.sql backend/phase_43_backend_driven_app_flow.sql \
            backend/phase_44_canonical_backend_freeze.sql \
            backend/phase_46_remove_redikall_pilot.sql

      - name: Prepare dedicated SSH identity
        id: ssh
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > /tmp/ilb-deploy.json
          jq -e '.host and .port and .user and .key' /tmp/ilb-deploy.json >/dev/null
          jq -r '.key' /tmp/ilb-deploy.json > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' /tmp/ilb-deploy.json)" "$(jq -r '.host' /tmp/ilb-deploy.json)" >> "$HOME/.ssh/known_hosts"

      - name: Upload migrations
        id: upload
        run: |
          set -euo pipefail
          tar -czf "/tmp/ilb-backend-${GITHUB_SHA}.tgz" \
            backend/phase_42*.sql backend/phase_43_backend_driven_app_flow.sql \
            backend/phase_44_canonical_backend_freeze.sql \
            backend/phase_46_remove_redikall_pilot.sql
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" \
            "/tmp/ilb-backend-${GITHUB_SHA}.tgz" \
            "$DEPLOY_USER@$DEPLOY_HOST:ilb-backend-${GITHUB_SHA}.tgz"

      - name: Apply migrations and verify
        id: migrate
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "BACKEND_SHA='$GITHUB_SHA' bash -s" > /tmp/backend-verification.tsv <<'REMOTE'
          set -euo pipefail
          CURRENT_STAGE="remote_initialization"
          DEFAULTS=""
          PACKAGE=""
          report_exit() {
            code=$?
            if test -n "$DEFAULTS"; then rm -f "$DEFAULTS"; fi
            if test -n "$PACKAGE"; then rm -f "$PACKAGE"; fi
            if test "$code" -ne 0; then
              printf 'migration_status\tfailed\n'
              printf 'failed_stage\t%s\n' "$CURRENT_STAGE"
              printf 'failure_code\t%s\n' "$code"
            fi
            exit "$code"
          }
          trap report_exit EXIT
          PACKAGE="$HOME/ilb-backend-${BACKEND_SHA}.tgz"
          STAGE="$HOME/deployments/ilovemybody-backend/${BACKEND_SHA}"
          APP_CONFIG="$HOME/domains/ilovemybody.in/public_html/app/config.php"
          DEFAULTS="$(mktemp "$HOME/.ilb-mysql.XXXXXX")"

          CURRENT_STAGE="host_prerequisites"
          test -f "$PACKAGE"
          test -f "$APP_CONFIG"
          command -v php >/dev/null
          command -v mysql >/dev/null
          mkdir -p "$STAGE"
          tar -xzf "$PACKAGE" -C "$STAGE"

          CURRENT_STAGE="private_database_configuration"
          php -r '
            $c = require $argv[1];
            if (!isset($c["db"])) { fwrite(STDERR, "Database configuration missing\n"); exit(2); }
            $d = $c["db"];
            $q = function ($v) {
              return "\"" . addcslashes((string)$v, "\\\"\n\r\t") . "\"";
            };
            echo "[client]\n";
            echo "host=" . $q($d["host"]) . "\n";
            echo "port=" . (int)$d["port"] . "\n";
            echo "user=" . $q($d["user"]) . "\n";
            echo "password=" . $q($d["pass"]) . "\n";
            echo "database=" . $q($d["name"]) . "\n";
            echo "default-character-set=utf8mb4\n";
          ' "$APP_CONFIG" > "$DEFAULTS"
          chmod 600 "$DEFAULTS"

          CURRENT_STAGE="database_connection"
          mysql --defaults-extra-file="$DEFAULTS" --execute="SELECT 1" >/dev/null 2>&1
          CURRENT_STAGE="phase_42_pre10_engine"
          mysql --defaults-extra-file="$DEFAULTS" \
            < "$STAGE/backend/phase_42_pre10_clarity_engine.sql" >/tmp/ilb-phase42.log
          CURRENT_STAGE="phase_42b_choice_library"
          mysql --defaults-extra-file="$DEFAULTS" \
            < "$STAGE/backend/phase_42b_pre10_choice_library.sql" >/tmp/ilb-phase42b.log
          CURRENT_STAGE="phase_42c_calculation_contract"
          mysql --defaults-extra-file="$DEFAULTS" \
            < "$STAGE/backend/phase_42c_pre10_calculation_contract.sql" >/tmp/ilb-phase42c.log
          CURRENT_STAGE="phase_43_backend_driven_flow"
          mysql --defaults-extra-file="$DEFAULTS" \
            < "$STAGE/backend/phase_43_backend_driven_app_flow.sql" >/tmp/ilb-phase43.log
          CURRENT_STAGE="phase_44_canonical_backend_freeze"
          mysql --defaults-extra-file="$DEFAULTS" \
            < "$STAGE/backend/phase_44_canonical_backend_freeze.sql" >/tmp/ilb-phase44.log
          CURRENT_STAGE="phase_46_remove_redikall_pilot"
          mysql --defaults-extra-file="$DEFAULTS" \
            < "$STAGE/backend/phase_46_remove_redikall_pilot.sql" >/tmp/ilb-phase46.log

          CURRENT_STAGE="backend_readiness_verification"
          BLOCKED="$(mysql --defaults-extra-file="$DEFAULTS" --batch --skip-column-names \
            --execute="SELECT COUNT(*) FROM v_ilb_backend_readiness WHERE readiness_status='blocked'")"
          test "$BLOCKED" = "0"
          APP_BLOCKED="$(mysql --defaults-extra-file="$DEFAULTS" --batch --skip-column-names \
            --execute="SELECT COUNT(*) FROM v_ilb_app_backend_readiness WHERE readiness_status='blocked'")"
          test "$APP_BLOCKED" = "0"

          mysql --defaults-extra-file="$DEFAULTS" --batch --skip-column-names --execute="
            SELECT 'migration_sha','${BACKEND_SHA}'
            UNION ALL SELECT 'pre10_dimensions',CAST(COUNT(*) AS CHAR) FROM ilb_pre10_dimension WHERE status='active'
            UNION ALL SELECT 'pre10_days',CAST(COUNT(*) AS CHAR) FROM ilb_pre10_day WHERE plan_key='pre10_clarity' AND version_label='1.0'
            UNION ALL SELECT 'pre10_assessments',CAST(COUNT(*) AS CHAR) FROM ilb_pre10_assessment WHERE status='active'
            UNION ALL SELECT 'pre10_items',CAST(COUNT(*) AS CHAR) FROM ilb_pre10_item WHERE status='active'
            UNION ALL SELECT 'pre10_options',CAST(COUNT(*) AS CHAR) FROM ilb_pre10_option
            UNION ALL SELECT 'pre10_result_definitions',CAST(COUNT(*) AS CHAR) FROM ilb_pre10_result_definition WHERE status='active'
            UNION ALL SELECT 'backend_readiness_blockers',CAST(COUNT(*) AS CHAR) FROM v_ilb_backend_readiness WHERE readiness_status='blocked'
            UNION ALL SELECT 'app_pathways',CAST(COUNT(*) AS CHAR) FROM ilb_app_pathway WHERE status='active'
            UNION ALL SELECT 'app_flow_steps',CAST(COUNT(*) AS CHAR) FROM v_ilb_app_flow_contract
            UNION ALL SELECT 'app_readiness_blockers',CAST(COUNT(*) AS CHAR) FROM v_ilb_app_backend_readiness WHERE readiness_status='blocked'
            UNION ALL SELECT 'frozen_releases',CAST(COUNT(*) AS CHAR) FROM ilb_backend_release WHERE status='frozen'
            UNION ALL SELECT 'canonical_backend_objects',CAST(COUNT(*) AS CHAR) FROM ilb_backend_object_registry WHERE lifecycle_status='canonical'
            UNION ALL SELECT 'isolated_legacy_objects',CAST(COUNT(*) AS CHAR) FROM ilb_backend_object_registry WHERE lifecycle_status IN ('superseded','retired','blocked')
            UNION ALL SELECT 'redikall_tables_remaining',CAST(COUNT(*) AS CHAR) FROM information_schema.tables WHERE table_schema=DATABASE() AND (table_name LIKE 'ilb_energy_map_%' OR table_name LIKE 'ilb_energy_point_%')
            UNION ALL SELECT 'redikall_registry_rows',CAST(COUNT(*) AS CHAR) FROM ilb_backend_object_registry WHERE object_name IN ('ilb_energy_map_system','ilb_energy_map_point','ilb_energy_point_observation','ilb_energy_point_response')
            UNION ALL SELECT 'verified_at_utc',UTC_TIMESTAMP();
          "
          printf 'migration_status\tverified\n'
          rm -f "$DEFAULTS" "$PACKAGE"
          trap - EXIT
          REMOTE

          grep -q $'migration_status\tverified' /tmp/backend-verification.tsv

      - name: Record non-sensitive live verification
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# Live Backend Status"
            echo
            echo "This file records a sanitized Hostinger backend migration outcome."
            echo
            echo "| Check | Live value |"
            echo "|---|---:|"
            if test -s /tmp/backend-verification.tsv; then
              awk -F '\t' 'NF>=2 { gsub(/\|/, "\\|", $1); gsub(/\|/, "\\|", $2); printf("| %s | %s |\\n",$1,$2) }' /tmp/backend-verification.tsv
            else
              echo "| migration_status | workflow_stopped_before_remote_verification |"
            fi
            echo "| source_validation | ${{ steps.validate.outcome }} |"
            echo "| ssh_preparation | ${{ steps.ssh.outcome }} |"
            echo "| migration_upload | ${{ steps.upload.outcome }} |"
            echo "| github_step_outcome | ${{ steps.migrate.outcome }} |"
            echo
            echo "No patient-authored data or credentials are included."
          } > docs/LIVE_BACKEND_STATUS.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LIVE_BACKEND_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record verified live backend migration [skip ci]"
            git push
          fi

      - name: Enforce successful migration
        if: steps.migrate.outcome != 'success'
        run: exit 1
