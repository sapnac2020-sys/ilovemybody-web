name: Migrate I Love My Body Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/phase_47_hospital_product_contract.sql"
      - "backend/phase_48_patient_runtime_contract.sql"
      - "backend/phase_49_plug_and_play_freeze.sql"
      - "backend/phase_50_gita_verification_system.sql"
      - "backend/phase_50a_gita_corpus.sql.gz"
      - "ops/run-backend-migrations.php"
      - ".github/workflows/migrate-backend.yml"

concurrency:
  group: ilovemybody-production-backend
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration sources
        run: |
          set -euo pipefail
          test -s backend/phase_47_hospital_product_contract.sql
          test -s backend/phase_48_patient_runtime_contract.sql
          test -s backend/phase_49_plug_and_play_freeze.sql
          test -s backend/phase_50_gita_verification_system.sql
          test -s backend/phase_50a_gita_corpus.sql.gz
          gzip -t backend/phase_50a_gita_corpus.sql.gz
          test -s ops/run-backend-migrations.php
          php -l ops/run-backend-migrations.php

      - name: Prepare dedicated SSH identity
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/ilovemybody_deploy"
          chmod 600 "$HOME/.ssh/ilovemybody_deploy"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" \
            "$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload exact migration package
        run: |
          set -euo pipefail
          remote_dir="/tmp/ilovemybody_backend_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_DIR=$remote_dir" >> "$GITHUB_ENV"
          ssh -i "$HOME/.ssh/ilovemybody_deploy" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$remote_dir'"
          # Hostinger supports legacy SCP over SSH but rejects the default SFTP subsystem.\n          scp -O -i "$HOME/.ssh/ilovemybody_deploy" -P "$DEPLOY_PORT" \
            backend/phase_47_hospital_product_contract.sql \
            backend/phase_48_patient_runtime_contract.sql \
            backend/phase_49_plug_and_play_freeze.sql \
            backend/phase_50_gita_verification_system.sql \
            backend/phase_50a_gita_corpus.sql.gz \
            ops/run-backend-migrations.php \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/"

      - name: Run and verify exact database migration
        run: |
          set -uo pipefail
          ssh -i "$HOME/.ssh/ilovemybody_deploy" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "php '$REMOTE_DIR/run-backend-migrations.php' \
            \"\$HOME/domains/ilovemybody.in/public_html/app/config.php\" \
            '$REMOTE_DIR'" | tee "$RUNNER_TEMP/backend-migration-result.txt"
          migration_exit="${PIPESTATUS[0]}"
          if [ "$migration_exit" -eq 0 ] && grep -q 'missing_objects=0' "$RUNNER_TEMP/backend-migration-result.txt"; then
            echo "MIGRATION_VERDICT=verified" >> "$GITHUB_ENV"
          else
            echo "MIGRATION_VERDICT=failed" >> "$GITHUB_ENV"
          fi

      - name: Publish verified backend receipt
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# Live Backend Status"
            echo
            echo "- Database: \`u756742628_ilovemybody\`"
            echo "- Migration: phases 47, 48, 49 and 50"
            echo "- Verification: \`${MIGRATION_VERDICT:-workflow_failed_before_migration}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\` (attempt \`${GITHUB_RUN_ATTEMPT}\`)"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Verified at (UTC): \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo
            echo '```text'
            if [ -f "$RUNNER_TEMP/backend-migration-result.txt" ]; then
              cat "$RUNNER_TEMP/backend-migration-result.txt"
            else
              echo "Migration command was not reached."
            fi
            echo '```'
          } > docs/LIVE_BACKEND_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LIVE_BACKEND_STATUS.md
          git commit -m "docs: record verified live backend migration"
          git push

      - name: Enforce verified migration
        if: always()
        run: |
          test "${MIGRATION_VERDICT:-failed}" = "verified"

      - name: Remove temporary migration package
        if: always()
        run: |
          if [ -n "${REMOTE_DIR:-}" ]; then
            ssh -i "$HOME/.ssh/ilovemybody_deploy" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "rm -f '$REMOTE_DIR/phase_47_hospital_product_contract.sql' \
              '$REMOTE_DIR/phase_48_patient_runtime_contract.sql' \
              '$REMOTE_DIR/phase_49_plug_and_play_freeze.sql' \
              '$REMOTE_DIR/phase_50_gita_verification_system.sql' \
              '$REMOTE_DIR/phase_50a_gita_corpus.sql.gz' \
              '$REMOTE_DIR/run-backend-migrations.php'; rmdir '$REMOTE_DIR' 2>/dev/null || true" || true
          fi
