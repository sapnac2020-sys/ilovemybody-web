name: Deploy psoriasis hospital intake
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/psoriasis-intake.php
      - app/psoriasis-intake-api.php
      - .github/workflows/deploy-psoriasis-intake.yml
permissions:
  contents: read
concurrency:
  group: ilmb-psoriasis-intake-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          php -l app/psoriasis-intake.php
          php -l app/psoriasis-intake-api.php
          grep -q 'require_case' app/psoriasis-intake-api.php
          grep -q 'does not calculate equivalence' app/psoriasis-intake.php
      - name: Deploy private intake
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          mkdir -p "$HOME/.ssh"; jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          host="$(jq -r '.host' "$RUNNER_TEMP/deploy.json")"; port="$(jq -r '.port' "$RUNNER_TEMP/deploy.json")"; user="$(jq -r '.user' "$RUNNER_TEMP/deploy.json")"
          scp -o StrictHostKeyChecking=accept-new -i "$HOME/.ssh/id_ed25519" -P "$port" app/psoriasis-intake.php app/psoriasis-intake-api.php "$user@$host:domains/ilovemybody.in/public_html/app/"
          body="$(curl --max-time 30 -sS https://ilovemybody.in/app/psoriasis-intake.php)"
          grep -q '<h1>404</h1>' <<<"$body"
