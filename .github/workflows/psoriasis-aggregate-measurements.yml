name: Extract psoriasis aggregate measurements
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [backend/phase_85_psoriasis_aggregate_measurements.sql, ops/extract-psoriasis-aggregate-measurements.php, .github/workflows/psoriasis-aggregate-measurements.yml]
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: php -l ops/extract-psoriasis-aggregate-measurements.php
      - name: Prepare SSH
        env: {DEPLOY_BUNDLE: "${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}"}
        run: |
          set -euo pipefail; printf '%s' "$DEPLOY_BUNDLE" | base64 --decode >"$RUNNER_TEMP/d.json"; mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"; jq -r '.key' "$RUNNER_TEMP/d.json" >"$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          echo "H=$(jq -r '.host' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; echo "P=$(jq -r '.port' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; echo "U=$(jq -r '.user' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; ssh-keyscan -p "$(jq -r '.port' "$RUNNER_TEMP/d.json")" "$(jq -r '.host' "$RUNNER_TEMP/d.json")" >>"$HOME/.ssh/known_hosts"
      - name: Extract aggregate measurement cells
        run: |
          set -euo pipefail; scp -i "$HOME/.ssh/id_ed25519" -P "$P" backend/phase_85_psoriasis_aggregate_measurements.sql ops/extract-psoriasis-aggregate-measurements.php "$U@$H:/tmp/"; set +e
          ssh -i "$HOME/.ssh/id_ed25519" -p "$P" "$U@$H" "php /tmp/extract-psoriasis-aggregate-measurements.php \"\$HOME/domains/ilovemybody.in/ilmb-config.php\" /tmp/phase_85_psoriasis_aggregate_measurements.sql" >"$RUNNER_TEMP/p85.json" 2>"$RUNNER_TEMP/p85.err"; rc=$?; set -e
          if [ "$rc" -ne 0 ]; then err="$(tail -c 3000 "$RUNNER_TEMP/p85.json"; tail -c 3000 "$RUNNER_TEMP/p85.err")"; jq -n --arg error "$err" --argjson exit_code "$rc" '{phase:"P85_AGGREGATE_MEASUREMENTS",verified:false,exit_code:$exit_code,error:$error,participant_level_data_requested:false,patient_tables_queried:false,patient_rows_read:0,patient_rows_modified:0}' >"$RUNNER_TEMP/proof.json"; exit "$rc"; fi
          jq -e '.covered_agents==11 and .aggregate_measurement_cells>0 and .computation_eligible_measurements==0 and .participant_level_data_requested==false and .verified==true and .patient_rows_read==0 and .patient_rows_modified==0' "$RUNNER_TEMP/p85.json" >/dev/null; cp "$RUNNER_TEMP/p85.json" "$RUNNER_TEMP/proof.json"
      - name: Publish durable proof
        if: always()
        run: |
          set -euo pipefail; test -f "$RUNNER_TEMP/proof.json"; mkdir -p proofs; cp "$RUNNER_TEMP/proof.json" proofs/psoriasis-aggregate-measurements-latest.json; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add proofs/psoriasis-aggregate-measurements-latest.json
          if git diff --cached --quiet; then exit 0; fi; git commit -m "proof: extract psoriasis aggregate measurements [skip ci]"; git push origin HEAD:main
