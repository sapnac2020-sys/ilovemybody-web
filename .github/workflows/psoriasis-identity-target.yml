name: Resolve psoriasis identities and targets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/phase_79_psoriasis_identity_target.sql
      - ops/resolve-psoriasis-identities-targets.php
      - .github/workflows/psoriasis-identity-target.yml

jobs:
  resolve-promote-verify:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: php -l ops/resolve-psoriasis-identities-targets.php
      - name: Prepare SSH
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode >"$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" >"$HOME/.ssh/id_ed25519" && chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >>"$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >>"$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >>"$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" "$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >>"$HOME/.ssh/known_hosts"
      - name: Resolve from primary APIs and promote exact matches
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" backend/phase_79_psoriasis_identity_target.sql ops/resolve-psoriasis-identities-targets.php "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          set +e
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "php /tmp/resolve-psoriasis-identities-targets.php \"\$HOME/domains/ilovemybody.in/ilmb-config.php\" /tmp/phase_79_psoriasis_identity_target.sql" >"$RUNNER_TEMP/p79.json" 2>"$RUNNER_TEMP/p79.err"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            err="$(tail -c 3000 "$RUNNER_TEMP/p79.json"; tail -c 3000 "$RUNNER_TEMP/p79.err")"
            jq -n --arg error "$err" --argjson exit_code "$rc" '{phase:"P79_IDENTITY_TARGET",verified:false,exit_code:$exit_code,error:$error,patient_tables_queried:false,patient_rows_read:0,patient_rows_modified:0}' >"$RUNNER_TEMP/psoriasis-identity-target.json"
            exit "$rc"
          fi
          jq -e '.database=="u756742628_ilovemybody" and .phase=="P79_IDENTITY_TARGET" and .rxnorm_exact_agents==11 and .uniprot_verified_components==8 and .eligible_target_mappings==11 and .verified==true and .patient_rows_read==0 and .patient_rows_modified==0' "$RUNNER_TEMP/p79.json" >/dev/null
          cp "$RUNNER_TEMP/p79.json" "$RUNNER_TEMP/psoriasis-identity-target.json"
      - name: Publish durable proof
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/psoriasis-identity-target.json"
          mkdir -p proofs
          cp "$RUNNER_TEMP/psoriasis-identity-target.json" proofs/psoriasis-identity-target-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proofs/psoriasis-identity-target-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "proof: verify psoriasis identities and targets [skip ci]"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psoriasis-identity-target-proof
          path: ${{ runner.temp }}/psoriasis-identity-target.json
          if-no-files-found: error
          retention-days: 30
