name: Extract psoriasis regulatory label sections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [backend/phase_81_psoriasis_label_sections.sql, ops/extract-psoriasis-label-sections.php, .github/workflows/psoriasis-label-sections.yml]
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: php -l ops/extract-psoriasis-label-sections.php
      - name: Prepare SSH
        env: {DEPLOY_BUNDLE: "${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}"}
        run: |
          set -euo pipefail; printf '%s' "$DEPLOY_BUNDLE" | base64 --decode >"$RUNNER_TEMP/d.json"; mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"; jq -r '.key' "$RUNNER_TEMP/d.json" >"$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          echo "H=$(jq -r '.host' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; echo "P=$(jq -r '.port' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; echo "U=$(jq -r '.user' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; ssh-keyscan -p "$(jq -r '.port' "$RUNNER_TEMP/d.json")" "$(jq -r '.host' "$RUNNER_TEMP/d.json")" >>"$HOME/.ssh/known_hosts"
      - name: Extract live SPL sections
        run: |
          set -euo pipefail; scp -i "$HOME/.ssh/id_ed25519" -P "$P" backend/phase_81_psoriasis_label_sections.sql ops/extract-psoriasis-label-sections.php "$U@$H:/tmp/"; set +e
          ssh -i "$HOME/.ssh/id_ed25519" -p "$P" "$U@$H" "php /tmp/extract-psoriasis-label-sections.php \"\$HOME/domains/ilovemybody.in/ilmb-config.php\" /tmp/phase_81_psoriasis_label_sections.sql" >"$RUNNER_TEMP/p81.json" 2>"$RUNNER_TEMP/p81.err"; rc=$?; set -e
          if [ "$rc" -ne 0 ]; then err="$(tail -c 3000 "$RUNNER_TEMP/p81.json"; tail -c 3000 "$RUNNER_TEMP/p81.err")"; jq -n --arg error "$err" --argjson exit_code "$rc" '{phase:"P81_LABEL_SECTIONS",verified:false,exit_code:$exit_code,error:$error,patient_tables_queried:false,patient_rows_read:0,patient_rows_modified:0}' >"$RUNNER_TEMP/proof.json"; exit "$rc"; fi
          jq -e '.registered_labels>=11 and .covered_agents==11 and .exact_sections>0 and .coverage_cells==88 and .verified==true and .patient_rows_read==0 and .patient_rows_modified==0' "$RUNNER_TEMP/p81.json" >/dev/null; cp "$RUNNER_TEMP/p81.json" "$RUNNER_TEMP/proof.json"
      - name: Publish durable proof
        if: always()
        run: |
          set -euo pipefail; test -f "$RUNNER_TEMP/proof.json"; mkdir -p proofs; cp "$RUNNER_TEMP/proof.json" proofs/psoriasis-label-sections-latest.json; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add proofs/psoriasis-label-sections-latest.json
          if git diff --cached --quiet; then exit 0; fi; git commit -m "proof: extract psoriasis label sections [skip ci]"; git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: psoriasis-label-sections-proof, path: "${{ runner.temp }}/proof.json", if-no-files-found: error, retention-days: 30}
