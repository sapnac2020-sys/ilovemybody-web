name: Recover missing ChEBI Excel workbooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ops/excel-sync/scripts/regenerate_chebi_excel.py
      - .github/workflows/recover-chebi-workbooks.yml

permissions:
  contents: read

concurrency:
  group: ilmb-chebi-workbook-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Validate generator
        run: |
          set -euo pipefail
          python -m py_compile ops/excel-sync/scripts/regenerate_chebi_excel.py
          grep -q '"parts": 42' ops/excel-sync/scripts/regenerate_chebi_excel.py
          grep -q 'len(registry) != 80' ops/excel-sync/scripts/regenerate_chebi_excel.py

      - name: Prepare Hostinger SSH
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"

      - name: Install generator privately
        run: |
          set -euo pipefail
          ssh_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT")
          scp_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT")
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p "$HOME/private/ilmb-chebi-recovery"'
          scp "${scp_args[@]}" ops/excel-sync/scripts/regenerate_chebi_excel.py             "$DEPLOY_USER@$DEPLOY_HOST:private/ilmb-chebi-recovery/regenerate_chebi_excel.py"

      - name: Validate frozen release and regenerate 80 files
        run: |
          set -euo pipefail
          ssh_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT")
          scp_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT")
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/private/ilmb-excel-sync"
          CURRENT="$ROOT/current"
          test -s "$CURRENT/ilmb-sync.env"
          set -a
          . "$CURRENT/ilmb-sync.env"
          set +a
          RELEASE_DIR="$ILMB_WORK_DIR/chebi/releases/2026-08-14"
          MANIFEST="$RELEASE_DIR/manifest.json"
          if ! test -s "$MANIFEST"; then
            echo "Frozen source cache missing; fetching the official ChEBI bulk source under strict recorded-total gates."
            "$CURRENT/.venv/bin/ilmb-sync" chebi-fetch --release 2026-08-14 --timeout 300 \
              > "$HOME/private/ilmb-chebi-recovery/source-fetch.json"
          fi
          "$CURRENT/.venv/bin/ilmb-sync" chebi-validate "$MANIFEST" > "$HOME/private/ilmb-chebi-recovery/source-validation.json"
          "$CURRENT/.venv/bin/python" - "$HOME/private/ilmb-chebi-recovery/source-validation.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding="utf-8"))
          assert p["complete"] is True
          expected={"chemical_data":202351,"comments":4414,"compound_origins":81324,
                    "database_accession":422748,"relation":408817,"relation_type":11,
                    "secondary_ids":19421,"source":93,"status":3,
                    "structure_registry":215365,"structures":201362,"wurcs":11441}
          got={x["name"]:x.get("row_count") for x in p["files"]}
          bad={k:(got.get(k),v) for k,v in expected.items() if got.get(k)!=v}
          if bad: raise SystemExit("Recorded ChEBI Release 254 row gates failed: "+repr(bad))
          print("RECORDED_RELEASE_254_SOURCE_GATES=PASS")
          PY
          python_bin="$CURRENT/.venv/bin/python"
          "$python_bin" -c 'import openpyxl'
          OUT="$HOME/private/ilmb-chebi-recovery/remaining-80-release-2026-08-14"
          mkdir -p "$OUT"
          "$python_bin" "$HOME/private/ilmb-chebi-recovery/regenerate_chebi_excel.py"             --release-dir "$RELEASE_DIR" --output-dir "$OUT"             | tee "$HOME/private/ilmb-chebi-recovery/recovery-result.json"
          test "$(find "$OUT" -maxdepth 1 -name 'ILMB_ChEBI_*.xlsx' | wc -l)" -eq 80
          test -s "$OUT/ILMB_ChEBI_Remaining_80_Release_2026-08-14.zip"
          test -s "$OUT/ILMB_ChEBI_Remaining_80_Manifest.json"
          REMOTE

      - name: Retrieve verification manifests
        run: |
          set -euo pipefail
          ssh_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT")
          scp_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT")
          mkdir -p recovery-verification
          scp "${scp_args[@]}"             "$DEPLOY_USER@$DEPLOY_HOST:private/ilmb-chebi-recovery/source-validation.json"             recovery-verification/
          scp "${scp_args[@]}"             "$DEPLOY_USER@$DEPLOY_HOST:private/ilmb-chebi-recovery/recovery-result.json"             recovery-verification/
          scp "${scp_args[@]}"             "$DEPLOY_USER@$DEPLOY_HOST:private/ilmb-chebi-recovery/remaining-80-release-2026-08-14/ILMB_ChEBI_Remaining_80_Manifest.json"             recovery-verification/
          jq -e '.ok==true and .file_count==80 and .row_count==1768704'             recovery-verification/recovery-result.json

      - uses: actions/upload-artifact@v4
        with:
          name: chebi-recovery-verification
          path: recovery-verification/
          retention-days: 90
