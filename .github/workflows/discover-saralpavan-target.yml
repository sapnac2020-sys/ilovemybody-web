name: Discover Saral Pavan Hostinger Target

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-saralpavan-target.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare existing Hostinger SSH identity
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/hostinger_deploy"
          chmod 600 "$HOME/.ssh/hostinger_deploy"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p "$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" "$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$HOME/.ssh/known_hosts"; then
              break
            fi
            test "$attempt" -lt 3
          done
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Discover isolated Saral Pavan target
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hostinger_deploy" -p "$DEPLOY_PORT"             "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "discovery_version=1"
          echo "php_version=$(php -r 'echo PHP_MAJOR_VERSION,".",PHP_MINOR_VERSION;' 2>/dev/null || echo unavailable)"
          echo "candidate_directories:"
          find "$HOME/domains" -maxdepth 5 -type d             \( -iname '*saral*pavan*' -o -iname '*saralpavan*' -o -iname '*cosmic*guidance*' \)             -print 2>/dev/null | sed "s#^$HOME#~#" | sort
          echo "candidate_config_names:"
          find "$HOME" -maxdepth 7 -type f             \( -path '*saralpavan*config*.php' -o -path '*saral*pavan*config*.php' \)             -print 2>/dev/null | sed "s#^$HOME#~#" | sort
          echo "target_top_level_files:"
          find "$HOME/domains/saralpavan.com" -maxdepth 3 -type f -printf '%m %p\n' 2>/dev/null |
            sed "s#^\([0-9]*\) $HOME#\1 ~#" | sort
          echo "target_environment_names:"
          if [ -f "$HOME/domains/saralpavan.com/public_html/.env" ]; then
            sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$HOME/domains/saralpavan.com/public_html/.env" | sort
          fi
          echo "mysql_defaults_available:"
          for defaults in "$HOME/.my.cnf" "$HOME/.mylogin.cnf"; do
            if [ -f "$defaults" ]; then
              printf '%s %s\n' "$(stat -c '%a' "$defaults")" "${defaults/#$HOME/~}"
            fi
          done
          echo "saralpavan_database_access:"
          if command -v mysql >/dev/null 2>&1 && mysql --batch --skip-column-names -e "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME='u756742628_saralpavan';" 2>/dev/null | grep -qx 'u756742628_saralpavan'; then
            echo "available"
            mysql --batch --skip-column-names -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA='u756742628_saralpavan';"
          else
            echo "unavailable_without_config"
          fi
          echo "matching_database_config_files:"
          find "$HOME" -maxdepth 7 -type f -name '*.php' -print0 2>/dev/null |
            xargs -0 grep -Il 'u756742628_saralpavan' 2>/dev/null |
            sed "s#^$HOME#~#" | sort || true
          echo "candidate_git_worktrees:"
          find "$HOME/domains" -maxdepth 7 -type d -name .git -print 2>/dev/null |
            while IFS= read -r gitdir; do
              worktree="${gitdir%/.git}"
              remote="$(git -C "$worktree" remote get-url origin 2>/dev/null || true)"
              case "$remote" in
                *ilovemybody-saralpavan*)
                  printf '%s | %s\n' "${worktree/#$HOME/~}" "$remote"
                  ;;
              esac
            done
          REMOTE
