name: Deploy psoriasis production through Phase 127

on:
  push:
    branches:
      - main
    paths:
      - backend/phase_*psoriasis*.sql
      - ops/deploy-psoriasis-through-127.php
      - .github/workflows/deploy-psoriasis-through-127.yml
  workflow_dispatch:

concurrency:
  group: ilmb-psoriasis-production-through-127
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment bundle
        run: |
          set -euo pipefail
          php -l ops/deploy-psoriasis-through-127.php
          test -f backend/phase_106_psoriasis_encyclopedia.sql
          test -f backend/phase_118_psoriasis_keratinocyte_compartments.sql
          test -f backend/phase_124_psoriasis_multisystem_control_matrix.sql
          test -f backend/phase_125_psoriasis_minimal_control_set.sql
          test -f backend/phase_126_psoriasis_cross_modality_intersections.sql
          test -f backend/phase_127_psoriasis_intersection_derived_stack.sql

      - name: Prepare dedicated SSH identity
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > /tmp/ilb-deploy.json
          jq -e '.host and .port and .user and .key' /tmp/ilb-deploy.json >/dev/null
          jq -r '.key' /tmp/ilb-deploy.json > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' /tmp/ilb-deploy.json)" "$(jq -r '.host' /tmp/ilb-deploy.json)" >> "$HOME/.ssh/known_hosts"

      - name: Package psoriasis SQL and migrator
        run: |
          set -euo pipefail
          tar -czf "/tmp/ilmb-psoriasis-${GITHUB_SHA}.tgz" backend/phase_*psoriasis*.sql ops/deploy-psoriasis-through-127.php

      - name: Upload package
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" "/tmp/ilmb-psoriasis-${GITHUB_SHA}.tgz" "$DEPLOY_USER@$DEPLOY_HOST:ilmb-psoriasis-${GITHUB_SHA}.tgz"

      - name: Apply and verify production DB
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "SITE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          TARGET="$HOME/domains/ilovemybody.in/public_html"
          PACKAGE="$HOME/ilmb-psoriasis-${SITE_SHA}.tgz"
          test -d "$TARGET"
          test -f "$PACKAGE"
          mkdir -p "$TARGET/backend" "$TARGET/ops"
          tar -xzf "$PACKAGE" -C "$TARGET"
          test -s "$TARGET/backend/db.php"
          cd "$TARGET"
          php ops/deploy-psoriasis-through-127.php | tee latest-psoriasis-phase127-production-proof.json
          grep -q '"ok": true' latest-psoriasis-phase127-production-proof.json
          grep -Eq '"phase127_stack_rows": [4-9][0-9]*' latest-psoriasis-phase127-production-proof.json
          rm -f "$PACKAGE"
          REMOTE
