name: Deploy acupuncture body-connection ledger

on:
  push:
    paths:
      - .github/workflows/deploy-acupuncture-body-connection-ledger.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded ledger migration on Hostinger
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          deploy_host="$(jq -r '.host' "$RUNNER_TEMP/deploy.json")"
          deploy_port="$(jq -r '.port' "$RUNNER_TEMP/deploy.json")"
          deploy_user="$(jq -r '.user' "$RUNNER_TEMP/deploy.json")"
          migration_b64="$(base64 -w0 backend/phase_72_acupuncture_body_connection_ledger.sql)"
          runner_b64="$(base64 -w0 ops/run-acupuncture-body-connection-ledger.php)"
          ssh_args=(
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=30
            -i "$HOME/.ssh/id_ed25519"
            -p "$deploy_port"
          )
          for attempt in 1 2 3; do
            echo "Hostinger migration attempt $attempt"
            if {
              cat <<'REMOTE_HEAD'
          set -euo pipefail
          remote_dir="/tmp/ilmb-acupuncture-body-ledger-$$"
          mkdir -p "$remote_dir"
          base64 --decode > "$remote_dir/phase_72.sql" <<'MIGRATION_SQL'
          REMOTE_HEAD
              printf '%s\n' "$migration_b64"
              cat <<'REMOTE_MIDDLE'
          MIGRATION_SQL
          base64 --decode > "$remote_dir/run.php" <<'RUNNER_PHP'
          REMOTE_MIDDLE
              printf '%s\n' "$runner_b64"
              cat <<'REMOTE_TAIL'
          RUNNER_PHP
          php "$remote_dir/run.php" "/home/$DEPLOY_USER/domains/ilovemybody.in/ilmb-config.php" "$remote_dir/phase_72.sql"
          REMOTE_TAIL
            } | ssh "${ssh_args[@]}" "$deploy_user@$deploy_host" "DEPLOY_USER='$deploy_user' bash -s"
            then
              exit 0
            fi
            test "$attempt" = 3 && exit 1
            sleep 10
          done
