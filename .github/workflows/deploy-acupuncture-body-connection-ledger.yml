name: Deploy acupuncture body-connection ledger

on:
  push:
    paths:
      - .github/workflows/deploy-acupuncture-body-connection-ledger.yml
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Hostinger execution path
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          deploy_host="$(jq -r '.host' "$RUNNER_TEMP/deploy.json")"
          deploy_port="$(jq -r '.port' "$RUNNER_TEMP/deploy.json")"
          deploy_user="$(jq -r '.user' "$RUNNER_TEMP/deploy.json")"
          ssh -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 -i "$HOME/.ssh/id_ed25519" -p "$deploy_port" \
            "$deploy_user@$deploy_host" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "ssh_shell=ok"
          echo "php_version=$(php -r 'echo PHP_VERSION;' 2>/dev/null)"
          test -s "$HOME/domains/ilovemybody.in/ilmb-config.php"
          echo "ilmb_config=present"
          find "$HOME/domains/ilovemybody.in" -maxdepth 4 -type f \
            \( -name 'phase_72_acupuncture_body_connection_ledger.sql' \
              -o -name 'run-acupuncture-body-connection-ledger.php' \) -print
          REMOTE
