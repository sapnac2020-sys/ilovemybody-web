name: Capture unmanaged science chain
on:
  push:
    branches: [govern-science-chain-psoriasis]
    paths:
      - scripts/capture_science_chain.php
      - scripts/psoriasis_skin_state.php
      - .github/workflows/capture-science-chain.yml
  workflow_dispatch:
jobs:
  verify-and-capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP
        run: |
          set -euo pipefail
          php -l scripts/capture_science_chain.php
          php -l scripts/psoriasis_skin_state.php
          php scripts/psoriasis_skin_state.php --self-test | tee "$RUNNER_TEMP/psoriasis-self-test.json"
      - name: Prepare SSH
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" "$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$HOME/.ssh/known_hosts"
      - name: Capture live definitions read-only
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" scripts/capture_science_chain.php "$DEPLOY_USER@$DEPLOY_HOST:/tmp/capture-science-chain-${GITHUB_RUN_ID}.php"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "php /tmp/capture-science-chain-${GITHUB_RUN_ID}.php \"\$HOME/domains/ilovemybody.in/ilmb-config.php\"; rm -f /tmp/capture-science-chain-${GITHUB_RUN_ID}.php" > "$RUNNER_TEMP/science-chain-live.json"
          jq -e '.database=="u756742628_ilovemybody" and .read_only==true and .patient_rows_modified==0' "$RUNNER_TEMP/science-chain-live.json"
      - uses: actions/upload-artifact@v4
        with:
          name: science-chain-governance-capture
          path: |
            ${{ runner.temp }}/science-chain-live.json
            ${{ runner.temp }}/psoriasis-self-test.json
          if-no-files-found: error
          retention-days: 14
