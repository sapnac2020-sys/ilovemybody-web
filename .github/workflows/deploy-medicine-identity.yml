name: Deploy medicine identity path

concurrency:
  group: ilmb-production-correlation-migrations
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/phase_53_medicine_identity_path.sql
      - ops/run-medicine-identity-migration.php
      - app/medicine-identity.php
      - app/medicine-identity-proof.html
      - .github/workflows/deploy-medicine-identity.yml

jobs:
  migrate-deploy-verify:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l ops/run-medicine-identity-migration.php
          php -l app/medicine-identity.php
      - name: Prepare SSH
        env: {DEPLOY_BUNDLE: "${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}"}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode >/tmp/d.json
          jq -r '.key' /tmp/d.json >"$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' /tmp/d.json)" >>"$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' /tmp/d.json)" >>"$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' /tmp/d.json)" >>"$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' /tmp/d.json)" "$(jq -r '.host' /tmp/d.json)" >>"$HOME/.ssh/known_hosts"
      - name: Migrate and deploy
        run: |
          set -euo pipefail
          tar -czf /tmp/medicine-identity.tgz backend/phase_53_medicine_identity_path.sql ops/run-medicine-identity-migration.php app/medicine-identity.php app/medicine-identity-proof.html
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" /tmp/medicine-identity.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/medicine-identity-${GITHUB_RUN_ID}.tgz"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          work="/tmp/medicine-identity-$RUN_ID"; rm -rf "$work"; mkdir -p "$work"
          tar -xzf "/tmp/medicine-identity-$RUN_ID.tgz" -C "$work"
          cat >"$work/run.sh" <<'RUNNER'
          #!/usr/bin/env bash
          set +e
          work="$1"
          php "$work/ops/run-medicine-identity-migration.php" "$HOME/domains/ilovemybody.in/ilmb-config.php" "$work/backend/phase_53_medicine_identity_path.sql" >"$work/migration.log" 2>&1
          rc=$?
          if test "$rc" -eq 0; then
            target="$HOME/domains/ilovemybody.in/public_html/app"
            install -m 600 "$work/app/medicine-identity.php" "$target/medicine-identity.php"
            install -m 644 "$work/app/medicine-identity-proof.html" "$target/medicine-identity-proof.html"
          fi
          printf '%s\n' "$rc" >"$work/exit-code"
          RUNNER
          chmod 700 "$work/run.sh"; nohup bash "$work/run.sh" "$work" </dev/null >"$work/nohup.log" 2>&1 &
          REMOTE
          remote_work="/tmp/medicine-identity-${GITHUB_RUN_ID}"
          for attempt in $(seq 1 120); do
            state="$(ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "if test -f '$remote_work/exit-code'; then cat '$remote_work/exit-code'; else echo RUNNING; fi")"
            if test "$state" != RUNNING; then
              ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$remote_work/migration.log'; rm -rf '$remote_work' '/tmp/medicine-identity-${GITHUB_RUN_ID}.tgz'"
              test "$state" = 0; exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Verify metformin identity proof
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'php -r '''parse_str("drug=metformin",$_GET); include $argv[1];''' "$HOME/domains/ilovemybody.in/public_html/app/medicine-identity.php"' > /tmp/proof.json
          jq -e '.ok==true and .mode=="non_patient_medicine_identity_proof" and .patient_data_read==false and .patient_data_written==false and .drug.id=="metformin" and .rxnorm.status=="exact_approved" and .rxnorm.id=="6809" and .mechanism.computation_eligible==false and .nlem_link.status=="blocked_missing_authoritative_crosswalk" and .chebi_link.status=="blocked_missing_authoritative_crosswalk"' /tmp/proof.json >/dev/null
          echo "MEDICINE_IDENTITY_PROOF=passed"
