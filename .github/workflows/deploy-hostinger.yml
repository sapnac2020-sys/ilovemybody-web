name: Deploy I Love My Body
# deployment retrigger: 2026-09-17T12:42+05:30

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - hospital.html
      - journey.html
      - therapies.html
      - mentors.html
      - philosophy.html
      - assets/**
      - app/index.php
      - app/access.php
      - app/new.php
      - app/nilesh.php
      - app/assets/**
      - .github/workflows/deploy-hostinger.yml

concurrency:
  group: ilovemybody-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        run: |
          set -euo pipefail
          test -s index.html
          test -s hospital.html
          test -s journey.html
          test -s therapies.html
          test -s mentors.html
          test -s philosophy.html
          test -s assets/hospital-lobby-final.b64
          test -s assets/site.css
          test -s assets/hospital-v2.css
          test -s assets/site.js
          test -s assets/hospital.js
          test -s app/index.php
          test -s app/access.php
          test -s app/new.php
          test -s app/nilesh.php
          test -s app/assets/app.css
          test -s app/assets/responsive.css
          test -s app/assets/app.js
          test -s app/assets/hospital-entry-ux.js
          node --check assets/site.js
          node --check assets/hospital.js
          node --check app/assets/app.js
          node --check app/assets/hospital-entry-ux.js
          grep -q '/hospital.html' index.html
          grep -q 'hospital-world' hospital.html
          grep -q 'HEALTH & HAPPINESS HOSPITAL' hospital.html
          grep -q 'NO LOGIN NEEDED TO EXPLORE' hospital.html
          grep -q 'data-room-panel="reception"' hospital.html
          grep -q 'Patient ID' app/access.php
          grep -q 'FIRST VISIT' app/new.php
          grep -q 'Patient ID' app/assets/hospital-entry-ux.js
          grep -q 'Mobile + PIN' app/assets/hospital-entry-ux.js

      - name: Prepare dedicated SSH identity
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > /tmp/ilb-deploy.json
          jq -e '.host and .port and .user and .key' /tmp/ilb-deploy.json >/dev/null
          jq -r '.key' /tmp/ilb-deploy.json > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' /tmp/ilb-deploy.json)" "$(jq -r '.host' /tmp/ilb-deploy.json)" >> "$HOME/.ssh/known_hosts"

      - name: Package website
        run: |
          base64 --decode assets/hospital-lobby-final.b64 > assets/hospital-lobby-final.jpg
          tar -czf "/tmp/ilovemybody-${GITHUB_SHA}.tgz" index.html hospital.html journey.html therapies.html mentors.html philosophy.html assets app

      - name: Upload release
        run: scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" "/tmp/ilovemybody-${GITHUB_SHA}.tgz" "$DEPLOY_USER@$DEPLOY_HOST:ilovemybody-${GITHUB_SHA}.tgz"

      - name: Back up and deploy site and patient frontend
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "SITE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          TARGET="$HOME/domains/ilovemybody.in/public_html"
          PACKAGE="$HOME/ilovemybody-${SITE_SHA}.tgz"
          STAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$HOME/backups/ilovemybody/$STAMP"
          STAGE="$HOME/deployments/ilovemybody/$SITE_SHA"
          test -d "$TARGET"; test -f "$PACKAGE"
          mkdir -p "$BACKUP" "$STAGE" "$TARGET/assets" "$TARGET/app/assets"
          for f in index.html hospital.html journey.html therapies.html mentors.html philosophy.html; do if test -f "$TARGET/$f"; then cp -p "$TARGET/$f" "$BACKUP/$f"; fi; done
          if test -d "$TARGET/assets"; then cp -a "$TARGET/assets" "$BACKUP/assets"; fi
          mkdir -p "$BACKUP/app"
          for f in index.php access.php new.php nilesh.php; do if test -f "$TARGET/app/$f"; then cp -p "$TARGET/app/$f" "$BACKUP/app/$f"; fi; done
          if test -d "$TARGET/app/assets"; then cp -a "$TARGET/app/assets" "$BACKUP/app/assets"; fi
          tar -xzf "$PACKAGE" -C "$STAGE"
          test -s "$STAGE/hospital.html"; test -s "$STAGE/assets/hospital-v2.css"; test -s "$STAGE/assets/hospital.js"
          test -s "$STAGE/app/index.php"; test -s "$STAGE/app/access.php"; test -s "$STAGE/app/new.php"; test -s "$STAGE/app/nilesh.php"
          cp -p "$STAGE/index.html" "$TARGET/index.html"
          cp -p "$STAGE/hospital.html" "$TARGET/hospital.html"
          cp -p "$STAGE/journey.html" "$TARGET/journey.html"
          cp -p "$STAGE/therapies.html" "$TARGET/therapies.html"
          cp -p "$STAGE/mentors.html" "$TARGET/mentors.html"
          cp -p "$STAGE/philosophy.html" "$TARGET/philosophy.html"
          cp -a "$STAGE/assets/." "$TARGET/assets/"
          cp -p "$STAGE/app/index.php" "$TARGET/app/index.php"
          cp -p "$STAGE/app/access.php" "$TARGET/app/access.php"
          cp -p "$STAGE/app/new.php" "$TARGET/app/new.php"
          cp -p "$STAGE/app/nilesh.php" "$TARGET/app/nilesh.php"
          cp -p "$STAGE/app/assets/app.css" "$TARGET/app/assets/app.css"
          cp -p "$STAGE/app/assets/responsive.css" "$TARGET/app/assets/responsive.css"
          cp -p "$STAGE/app/assets/app.js" "$TARGET/app/assets/app.js"
          cp -p "$STAGE/app/assets/hospital-entry-ux.js" "$TARGET/app/assets/hospital-entry-ux.js"
          if ! grep -q 'hospital-entry-ux.js' "$TARGET/app/index.php"; then
            python3 - "$TARGET/app/index.php" <<'PY'
import sys
p=sys.argv[1]
s=open(p,encoding='utf-8').read()
needle='</body></html>'
script='<script src="assets/hospital-entry-ux.js?v=2"></script>'
if needle not in s: raise SystemExit('closing body tag not found')
s=s.replace(needle,script+needle,1)
open(p,'w',encoding='utf-8').write(s)
PY
          fi
          test -s "$TARGET/app/api.php"
          REMOTE

      - name: Verify production
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 5 --max-time 30 --output /tmp/home.html https://ilovemybody.in/
          grep -q 'hospital-entrance' /tmp/home.html
          curl --fail --retry 5 --retry-delay 5 --max-time 30 --output /tmp/hospital.html https://ilovemybody.in/hospital.html
          grep -q 'NO LOGIN NEEDED TO EXPLORE' /tmp/hospital.html
          grep -q 'Patient ID + password' /tmp/hospital.html
          curl --fail --retry 5 --retry-delay 5 --max-time 30 --output /tmp/access.html https://ilovemybody.in/app/access.php
          grep -q 'Patient ID + password' /tmp/access.html
          curl --fail --retry 5 --retry-delay 5 --max-time 30 --output /tmp/new.html https://ilovemybody.in/app/new.php
          grep -q 'NO LOGIN REQUIRED' /tmp/new.html
          curl --fail --retry 5 --retry-delay 5 --max-time 30 --output /tmp/nilesh.html https://ilovemybody.in/app/nilesh.php
          grep -q 'PRIVATE PATIENT DASHBOARD' /tmp/nilesh.html
