name: Deploy I Love My Body Hospital

on:
  pull_request:
    paths: [index.html, 'assets/visual-*.jpg', 'assets/visual-*.png', .github/workflows/deploy-hostinger.yml]
  push:
    branches: [main]
    paths: [index.html, 'assets/visual-*.jpg', 'assets/visual-*.png', .github/workflows/deploy-hostinger.yml]
  workflow_dispatch:

concurrency:
  group: ilovemybody-public-hospital
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hospital source
        run: |
          set -euo pipefail
          test -s index.html
          for f in visual-37f243ec27c6.jpg visual-4e97e089ffa6.jpg visual-743ce6202334.png visual-a70606b81c9e.jpg; do test -s "assets/$f"; done
          for text in 'I LOVE MY BODY' 'Self-Care Hospital' 'Everything is connected' 'Hospital Lobby' 'Two Paths' 'Free Self-Tests' 'Complementary Therapies' 'My Journey' 'Evidence and Sources'; do grep -q "$text" index.html; done
          ! grep -qi 'Happiness Mall' index.html
          ! grep -q 'data:image/' index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Hostinger SSH identity
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" "$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$HOME/.ssh/known_hosts"
      - name: Package public hospital only
        run: |
          tar -czf "$RUNNER_TEMP/hospital-${GITHUB_SHA}.tgz" index.html assets/visual-37f243ec27c6.jpg assets/visual-4e97e089ffa6.jpg assets/visual-743ce6202334.png assets/visual-a70606b81c9e.jpg
      - name: Upload release
        run: |
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" "$RUNNER_TEMP/hospital-${GITHUB_SHA}.tgz" "$DEPLOY_USER@$DEPLOY_HOST:hospital-${GITHUB_SHA}.tgz"
      - name: Deploy without touching the private application or database
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "SITE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          TARGET="$HOME/domains/ilovemybody.in/public_html"
          PACKAGE="$HOME/hospital-${SITE_SHA}.tgz"
          STAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$HOME/backups/ilovemybody-public/$STAMP"
          STAGE="$HOME/deployments/ilovemybody-public/$SITE_SHA"
          mkdir -p "$BACKUP/assets" "$STAGE" "$TARGET/assets"
          test -s "$PACKAGE"
          tar -xzf "$PACKAGE" -C "$STAGE"
          test -s "$STAGE/index.html"
          test -d "$TARGET/app"
          test -s "$TARGET/app/config.php"
          test -f "$TARGET/index.html" && cp -p "$TARGET/index.html" "$BACKUP/index.html"
          for f in visual-37f243ec27c6.jpg visual-4e97e089ffa6.jpg visual-743ce6202334.png visual-a70606b81c9e.jpg; do
            test -f "$TARGET/assets/$f" && cp -p "$TARGET/assets/$f" "$BACKUP/assets/$f"
            cp -p "$STAGE/assets/$f" "$TARGET/assets/$f"
          done
          cp -p "$STAGE/index.html" "$TARGET/index.html.new"
          mv "$TARGET/index.html.new" "$TARGET/index.html"
          rm -f "$PACKAGE"
          REMOTE
      - name: Verify production and protected application boundary
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 3 --max-time 30 -o "$RUNNER_TEMP/home.html" https://ilovemybody.in/
          grep -q 'I LOVE MY BODY' "$RUNNER_TEMP/home.html"
          grep -q 'Hospital Lobby' "$RUNNER_TEMP/home.html"
          grep -q 'Free Self-Tests' "$RUNNER_TEMP/home.html"
          for f in visual-37f243ec27c6.jpg visual-4e97e089ffa6.jpg visual-743ce6202334.png visual-a70606b81c9e.jpg; do curl --fail --head --retry 3 --max-time 20 "https://ilovemybody.in/assets/$f"; done
          code=$(curl -sS -o "$RUNNER_TEMP/app.html" -w '%{http_code}' https://ilovemybody.in/app/)
          test "$code" = 200 -o "$code" = 302 -o "$code" = 401
          code=$(curl -sS -o "$RUNNER_TEMP/api.json" -w '%{http_code}' 'https://ilovemybody.in/app/api.php?action=bootstrap')
          test "$code" = 401

