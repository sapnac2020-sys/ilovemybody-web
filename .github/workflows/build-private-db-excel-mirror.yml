name: Build ILMB Private Full DB Excel Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '35 21 * * *'
  push:
    branches: [main]
    paths:
      - ops/excel-sync/src/ilmb_sync/private_mirror.py
      - .github/workflows/build-private-db-excel-mirror.yml

concurrency:
  group: ilovemybody-private-full-db-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          cat > "$HOME/.ssh/config" <<'SSHCONFIG'
          Host *
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 8
            IdentitiesOnly yes
          SSHCONFIG
          chmod 600 "$HOME/.ssh/config"
      - name: Upload mirror module
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/private-mirror-src.tgz"
          tar -C ops/excel-sync -czf "$package" src/ilmb_sync
          remote="/tmp/ilmb-private-mirror-${GITHUB_RUN_ID}.tgz"
          uploaded=false
          for attempt in 1 2 3 4 5; do
            if scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" "$package" "$DEPLOY_USER@$DEPLOY_HOST:$remote"; then uploaded=true; break; fi
            sleep $((attempt * 5))
          done
          test "$uploaded" = true
          echo "REMOTE_PACKAGE=$remote" >> "$GITHUB_ENV"
      - name: Generate private full DB mirror
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "REMOTE_PACKAGE='$REMOTE_PACKAGE' bash -s" <<'REMOTE' | tee "$RUNNER_TEMP/full-db-mirror-result.json"
          set -euo pipefail
          ROOT="$HOME/private/ilmb-excel-sync"
          CURRENT="$ROOT/current"
          EXCHANGE="$HOME/ilmb-data-exchange"
          WORK="/tmp/ilmb-private-mirror-run-$$"
          mkdir -p "$WORK"
          tar -xzf "$REMOTE_PACKAGE" -C "$WORK"
          test -L "$CURRENT"
          test -s "$CURRENT/ilmb-sync.env"
          test -x "$CURRENT/.venv/bin/python"
          set -a; . "$CURRENT/ilmb-sync.env"; set +a
          PYTHONPATH="$WORK/src" "$CURRENT/.venv/bin/python" -m ilmb_sync.private_mirror full-db --output-root "$EXCHANGE" --tables-per-workbook 20
          test -s "$EXCHANGE/db-mirror/current/00_CONTROL_ROOM.xlsx"
          test -s "$EXCHANGE/db-mirror/current/manifest.json"
          rm -rf "$WORK" "$REMOTE_PACKAGE"
          REMOTE
      - name: Publish metadata receipt only
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'full-db-mirror-result.json'
          lines=[x for x in p.read_text().splitlines() if x.strip()]
          d=json.loads(lines[-1])
          safe={
            'generated_at_utc':d.get('generated_at_utc'),
            'base_tables':d.get('base_tables'),
            'views':d.get('views'),
            'workbook_count':len(d.get('files',[])),
            'file_names':[x.get('file') for x in d.get('files',[])],
            'private_location':'$HOME/ilmb-data-exchange/db-mirror/current',
            'patient_data_published':False,
          }
          pathlib.Path('docs/audits/FULL_DB_EXCEL_MIRROR_LIVE.json').write_text(json.dumps(safe,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/audits/FULL_DB_EXCEL_MIRROR_LIVE.json
          if ! git diff --cached --quiet; then git commit -m 'docs: record private full DB Excel mirror'; git push; fi
