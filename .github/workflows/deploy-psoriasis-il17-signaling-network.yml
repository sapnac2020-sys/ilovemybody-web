name: Deploy Phase 112 psoriasis IL-17 signaling network

on:
  workflow_dispatch:
    inputs:
      phase111_verified:
        description: 'Type VERIFIED after Phase 111 verifier has passed in production'
        required: true
        type: string

jobs:
  deploy:
    if: ${{ inputs.phase111_verified == 'VERIFIED' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate files
        run: |
          test -f backend/phase_112_psoriasis_il17_signaling_network.sql
          test -f ops/verify-psoriasis-il17-signaling-network.php
          php -l ops/verify-psoriasis-il17-signaling-network.php
      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "backend/phase_112_psoriasis_il17_signaling_network.sql,ops/verify-psoriasis-il17-signaling-network.php"
          target: ${{ secrets.HOSTINGER_APP_PATH }}
      - name: Verify production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd "${{ secrets.HOSTINGER_APP_PATH }}"
            php ops/verify-psoriasis-il17-signaling-network.php | tee latest-phase112-proof.json
            grep -q '"ok": true' latest-phase112-proof.json
