name: Deploy EMDR psoriasis modality
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/phase_105_emdr_modality.sql
      - ops/verify-emdr-modality.php
      - .github/workflows/deploy-emdr-modality.yml
permissions:
  contents: read
concurrency:
  group: ilmb-emdr-modality-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: php -l ops/verify-emdr-modality.php
      - name: Apply guarded EMDR modality migration
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          host="$(jq -r '.host' "$RUNNER_TEMP/deploy.json")"; port="$(jq -r '.port' "$RUNNER_TEMP/deploy.json")"; user="$(jq -r '.user' "$RUNNER_TEMP/deploy.json")"
          ssh_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$HOME/.ssh/id_ed25519" -p "$port")
          tar -czf - backend/phase_105_emdr_modality.sql ops/verify-emdr-modality.php | ssh "${ssh_args[@]}" "$user@$host" 'mkdir -p "$HOME/private/ilmb-emdr-modality" && tar -xzf - -C "$HOME/private/ilmb-emdr-modality"'
          ssh "${ssh_args[@]}" "$user@$host" 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/private/ilmb-emdr-modality"
          config="$(find "$HOME/domains/ilovemybody.in" -maxdepth 5 -type f -name ilmb-config.php -print -quit)"
          test -s "$config"
          php "$root/ops/verify-emdr-modality.php" "$config" "$root/backend/phase_105_emdr_modality.sql" | tee "$root/latest-proof.json"
          REMOTE
