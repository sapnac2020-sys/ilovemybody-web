name: Deploy acupuncture equation verification
"on":
  push:
    paths:
      - backend/phase_74_acupuncture_equation_verification.sql
      - ops/run-acupuncture-equation-verification.php
      - .github/workflows/deploy-acupuncture-equation-verification.yml
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Apply and verify all acupuncture equations on Hostinger
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          h="$(jq -r .host "$RUNNER_TEMP/deploy.json")"; p="$(jq -r .port "$RUNNER_TEMP/deploy.json")"; u="$(jq -r .user "$RUNNER_TEMP/deploy.json")"
          ssh -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i "$HOME/.ssh/id_ed25519" -p "$p" "$u@$h" 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/ilovemybody.in/public_html"; config="$HOME/domains/ilovemybody.in/ilmb-config.php"
          php -l "$root/ops/run-acupuncture-equation-verification.php"
          php "$root/ops/run-acupuncture-equation-verification.php" "$config" "$root/backend/phase_74_acupuncture_equation_verification.sql"
          REMOTE
