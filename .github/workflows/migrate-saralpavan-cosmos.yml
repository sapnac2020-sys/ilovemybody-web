name: Migrate Saral Pavan Cosmos Foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/migrate-saralpavan-cosmos.yml"]

permissions:
  contents: read

concurrency:
  group: saralpavan-production-cosmos
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare Hostinger SSH identity
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/hostinger_deploy"
          chmod 600 "$HOME/.ssh/hostinger_deploy"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" "$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$HOME/.ssh/known_hosts"; then
              break
            fi
            test "$attempt" -lt 5
          done
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate, migrate and verify isolated cosmos database
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hostinger_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/domains/saralpavan.com/public_html"
          config="$HOME/domains/saralpavan.com/saralpavan_private/config.php"
          test -f "$config" && test -s "$config"
          mode="$(stat -c '%a' "$config")"
          if [ "$mode" != "600" ] && [ "$mode" != "400" ]; then
            chmod 600 "$config"
            mode="$(stat -c '%a' "$config")"
          fi
          case "$mode" in 600|400) ;; *) echo "config_permission_invalid=$mode"; exit 21;; esac
          echo "config_permission=$mode"
          batch2="/tmp/013_cosmos_scientific_expansion_batch_002.sql"
          printf "%s" "" | base64 --decode > "$batch2"
          chmod 600 "$batch2"
          batch4="/tmp/014_cosmos_body_geometry_rotation_batch_004.sql"
          printf "%s" "" | base64 --decode > "$batch4"
          chmod 600 "$batch4"
          batch5="/tmp/015_cosmos_bibliography_connector_batch_005.sql"
          printf "%s" "" | base64 --decode > "$batch5"
          chmod 600 "$batch5"
          batch6="/tmp/016_cosmos_iers_earth_orientation_batch_006.sql"
          printf "%s" "" | base64 --decode > "$batch6"
          chmod 600 "$batch6"
          batch7="/tmp/017_cosmos_precision_earth_moon_kernels_batch_007.sql"
          printf "%s" "" | base64 --decode > "$batch7"
          chmod 600 "$batch7"
          iers_sync="/tmp/sync_iers_eop_$.php"
          printf "%s" "" | base64 --decode > "$iers_sync"
          chmod 600 "$iers_sync"
          test -s "$app/database/011_cosmos_foundation_batch_001.sql"
          test -s "$app/database/012_source_first_cosmos_foundation.sql"
          test -s "$batch2"
          test -s "$batch4"
          test -s "$batch5"
          test -s "$batch6"
          test -s "$batch7"
          test -s "$iers_sync"
          runner="/tmp/saralpavan_cosmos_migrate_$$.php"
          cat > "$runner" <<'PHP'
          <?php
          declare(strict_types=1);
          $configPath = getenv('SP_CONFIG');
          $app = getenv('SP_APP');
          $cfg = require $configPath;
          if (!is_array($cfg) || !isset($cfg['db']) || !is_array($cfg['db'])) {
              throw new RuntimeException('Invalid Saral Pavan configuration contract');
          }
          $db = $cfg['db'];
          foreach (['host','name','user','pass'] as $key) {
              if (!isset($db[$key]) || !is_string($db[$key]) || $db[$key] === '') {
                  throw new RuntimeException('Missing database configuration field: ' . $key);
              }
          }
          if ($db['name'] !== 'u756742628_saralpavan') {
              throw new RuntimeException('Refusing non-Saral-Pavan database target');
          }
          $charset = isset($db['charset']) && is_string($db['charset']) ? $db['charset'] : 'utf8mb4';
          $pdo = new PDO(
              'mysql:host=' . $db['host'] . ';dbname=' . $db['name'] . ';charset=' . $charset,
              $db['user'], $db['pass'],
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
               PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
               PDO::MYSQL_ATTR_MULTI_STATEMENTS => true]
          );
          foreach ([$app . '/database/011_cosmos_foundation_batch_001.sql',$app . '/database/012_source_first_cosmos_foundation.sql','/tmp/013_cosmos_scientific_expansion_batch_002.sql','/tmp/014_cosmos_body_geometry_rotation_batch_004.sql','/tmp/015_cosmos_bibliography_connector_batch_005.sql','/tmp/016_cosmos_iers_earth_orientation_batch_006.sql','/tmp/017_cosmos_precision_earth_moon_kernels_batch_007.sql'] as $path) {
              $file = basename($path);
              $sql = file_get_contents($path);
              if ($sql === false || trim($sql) === '') throw new RuntimeException('Unreadable migration: ' . $file);
              $pdo->exec($sql);
              echo 'migration_applied=' . $file . "\n";
          }
          $eopCsv='/tmp/finals2000A.all.csv';
          $downloaded=false;
          for($attempt=1;$attempt<=5;$attempt++){
              $bytes=@file_put_contents($eopCsv,@fopen('https://datacenter.iers.org/data/csv/finals2000A.all.csv','rb'));
              if($bytes!==false && $bytes>3000000){$downloaded=true;break;}
              sleep(2);
          }
          if(!$downloaded) throw new RuntimeException('IERS EOP download failed');
          $eopHash=hash_file('sha256',$eopCsv);
          if($eopHash!=='68a4b10cc1f39cf63975d5a6dd7b5b7189dd2536e71fb6c2278b8c541d8c4dbf') throw new RuntimeException('IERS product changed; review new release before import');
          passthru('php '.escapeshellarg(getenv('SP_IERS_SYNC')).' '.escapeshellarg($configPath).' '.escapeshellarg($eopCsv),$syncCode);
          if($syncCode!==0) throw new RuntimeException('IERS EOP import failed');
          $expected = [
              'sp_cosmos_source','sp_cosmos_unit','sp_cosmos_time_standard','sp_cosmos_reference_frame',
              'sp_cosmos_object','sp_cosmos_validation_record','sp_cosmos_constant','sp_cosmos_body_parameter',
              'sp_cosmos_orbital_model','sp_cosmos_orbital_coefficient','sp_cosmos_node_definition',
              'sp_cosmos_equation','sp_cosmos_ephemeris_request','sp_cosmos_ephemeris_record',
              'sp_cosmos_eop_record','sp_cosmos_kernel_registry','sp_cosmos_approximation_error',
              'sp_cosmos_orbital_supplemental_term','sp_cosmos_body_shape','sp_cosmos_rotation_model',
              'sp_cosmos_rotation_coefficient','sp_cosmos_rotation_periodic_coefficient','sp_cosmos_nutation_phase_angle_coefficient',
              'sp_cosmos_bibliography','sp_cosmos_entity_citation','sp_cosmos_citation_policy','sp_cosmos_eop_release','sp_cosmos_kernel_accuracy_regime'
          ];
          $quoted = implode(',', array_fill(0, count($expected), '?'));
          $stmt = $pdo->prepare('SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=? AND TABLE_NAME IN (' . $quoted . ')');
          $stmt->execute(array_merge([$db['name']], $expected));
          $found = array_column($stmt->fetchAll(), 'TABLE_NAME');
          sort($found); sort($expected);
          $missing = array_values(array_diff($expected, $found));
          echo 'database=' . $db['name'] . "\n";
          echo 'expected_tables=' . count($expected) . "\n";
          echo 'found_tables=' . count($found) . "\n";
          echo 'missing_tables=' . count($missing) . "\n";
          if ($missing) { echo 'missing_names=' . implode(',', $missing) . "\n"; exit(31); }
          $checks = ['sources'=>['sp_cosmos_source',15], 'objects'=>['sp_cosmos_object',13],
                     'constants'=>['sp_cosmos_constant',13], 'validations'=>['sp_cosmos_validation_record',12],
                     'body_parameters'=>['sp_cosmos_body_parameter',10], 'orbital_models'=>['sp_cosmos_orbital_model',8],
                     'orbital_coefficients'=>['sp_cosmos_orbital_coefficient',48], 'approximation_errors'=>['sp_cosmos_approximation_error',16],
                     'supplemental_terms'=>['sp_cosmos_orbital_supplemental_term',4], 'equations'=>['sp_cosmos_equation',10],
                     'body_shapes'=>['sp_cosmos_body_shape',11], 'rotation_models'=>['sp_cosmos_rotation_model',11],
                     'rotation_coefficients'=>['sp_cosmos_rotation_coefficient',109], 'rotation_periodic'=>['sp_cosmos_rotation_periodic_coefficient',184],
                     'nutation_phase_coefficients'=>['sp_cosmos_nutation_phase_angle_coefficient',230],
                     'bibliography'=>['sp_cosmos_bibliography',21], 'citation_policies'=>['sp_cosmos_citation_policy',19],
                     'entity_citations'=>['sp_cosmos_entity_citation',20600], 'eop_releases'=>['sp_cosmos_eop_release',1],
                     'eop_records'=>['sp_cosmos_eop_record',19969], 'equations_total'=>['sp_cosmos_equation',22],
                     'kernel_accuracy_regimes'=>['sp_cosmos_kernel_accuracy_regime',5], 'reference_frames'=>['sp_cosmos_reference_frame',5]];
          foreach ($checks as $label => [$table, $minimum]) {
              $count = (int)$pdo->query('SELECT COUNT(*) FROM ' . $table)->fetchColumn();
              echo $label . '_rows=' . $count . "\n";
              if ($count < $minimum) throw new RuntimeException('Seed validation failed for ' . $table);
          }
          $failed = (int)$pdo->query("SELECT COUNT(*) FROM sp_cosmos_validation_record WHERE result IN ('FAIL','BLOCKED')")->fetchColumn();
          echo 'failed_or_blocked_validations=' . $failed . "\n";
          if ($failed !== 0) throw new RuntimeException('Cosmos validation gate failed');
          echo "cosmos_foundation_verdict=VERIFIED\n";
          PHP
          chmod 600 "$runner"
          trap 'rm -f "$runner" "$batch2" "$batch4" "$batch5" "$batch6" "$batch7" "$iers_sync" /tmp/finals2000A.all.csv' EXIT
          SP_CONFIG="$config" SP_APP="$app" SP_IERS_SYNC="$iers_sync" php "$runner"
          REMOTE

      - name: Acquire and register authoritative NAIF kernels
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hostinger_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          script="/tmp/sync_naif_kernels_$$.php"
          printf "%s" "" | base64 --decode > "$script"
          chmod 600 "$script"
          trap 'rm -f "$script"' EXIT
          php "$script" "$HOME/domains/saralpavan.com/saralpavan_private/config.php" "$HOME/domains/saralpavan.com/saralpavan_private"
          REMOTE

      - name: Acquire and register precision Earth and Moon kernels
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hostinger_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          script="/tmp/sync_precision_kernels_$$.php"
          printf "%s" "" | base64 --decode > "$script"
          chmod 600 "$script"
          trap 'rm -f "$script"' EXIT
          php "$script" "$HOME/domains/saralpavan.com/saralpavan_private/config.php" "$HOME/domains/saralpavan.com/saralpavan_private"
          REMOTE
