name: Audit I Love My Body Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/backend-audit.yml

concurrency:
  group: ilovemybody-backend-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate audit source
        run: |
          set -euo pipefail
          test -s ops/backend-audit.php
          php -l ops/backend-audit.php

      - name: Prepare dedicated SSH identity
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > /tmp/ilb-deploy.json
          jq -e '.host and .port and .user and .key' /tmp/ilb-deploy.json >/dev/null
          jq -r '.key' /tmp/ilb-deploy.json > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' /tmp/ilb-deploy.json)" >> "$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' /tmp/ilb-deploy.json)" "$(jq -r '.host' /tmp/ilb-deploy.json)" >> "$HOME/.ssh/known_hosts"

      - name: Run read-only production audit
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" \
            ops/backend-audit.php \
            "$DEPLOY_USER@$DEPLOY_HOST:ilb-backend-audit.php"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'php "$HOME/ilb-backend-audit.php" "$HOME/domains/ilovemybody.in/public_html/app/config.php"' \
            > backend-audit.json
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'rm -f "$HOME/ilb-backend-audit.php"'
          jq -e '.summary and .tables and .foreign_keys' backend-audit.json >/dev/null

      - name: Publish audit report
        run: |
          set -euo pipefail
          mkdir -p audit
          mv backend-audit.json audit/backend-audit.json
          git config user.name "ilovemybody-backend-audit"
          git config user.email "actions@users.noreply.github.com"
          git add audit/backend-audit.json
          if git diff --cached --quiet; then
            echo "Audit report is unchanged."
          else
            git commit -m "Update production backend audit"
            git push
          fi
