name: Deploy Saral Pavan Cosmos Master Bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-saralpavan-cosmos-master.yml"]
permissions:
  contents: read
concurrency:
  group: saralpavan-cosmos-master
  cancel-in-progress: false
jobs:
  deploy-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare Hostinger SSH
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
      - name: Deploy cosmos-only bridge and import Drive master
        env:
          SYNC_B64: 
          IMPORT_B64: 
        run: |
          set -euo pipefail
          ssh_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT")
          scp_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT")
          printf '%s' "$SYNC_B64" | base64 --decode > "$RUNNER_TEMP/sync_master_from_drive.php"
          printf '%s' "$IMPORT_B64" | base64 --decode > "$RUNNER_TEMP/cosmos_master_import.php"
          copied=false
          for attempt in 1 2 3 4 5; do
            if scp "${scp_args[@]}" "$RUNNER_TEMP/sync_master_from_drive.php" "$RUNNER_TEMP/cosmos_master_import.php" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"; then
              copied=true
              break
            fi
            sleep 10
          done
          test "$copied" = true
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/domains/saralpavan.com/public_html"
          private="$HOME/domains/saralpavan.com/saralpavan_private"
          test -d "$app/scripts"
          test -s "$private/config.php"
          key_count="$(find "$private/credentials" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$key_count" = 1
          service_key="$(find "$private/credentials" -maxdepth 1 -type f -name '*.json' -print -quit)"
          SP_CONFIG="$private/config.php" SP_KEY="$service_key" php -r '
            $path=getenv("SP_CONFIG"); $cfg=require $path;
            if (!is_array($cfg) || !isset($cfg["db"])) { fwrite(STDERR,"invalid private config\n"); exit(31); }
            $cfg["drive"]=[
              "master_file_id"=>"1a2lEm-xtopkC5YCCEK6MTyq5YWXrXb-O",
              "service_account_key"=>getenv("SP_KEY")
            ];
            $body="<?php\nreturn ".var_export($cfg,true).";\n";
            if(file_put_contents($path,$body)===false) exit(32);
          '
          chmod 600 "$private/config.php"
          SP_CONFIG="$private/config.php" php -r '
            $c=require getenv("SP_CONFIG"); $d=$c["db"];
            if(($d["name"]??"")!=="u756742628_saralpavan") exit(41);
            $pdo=new PDO("mysql:host=".$d["host"].";dbname=".$d["name"].";charset=".($d["charset"]??"utf8mb4"),$d["user"],$d["pass"],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
            $pdo->exec("CREATE TABLE IF NOT EXISTS cg_workbook_sync (
              sync_id CHAR(36) PRIMARY KEY,
              direction ENUM(\"DRIVE_TO_INTAKE\",\"INTAKE_TO_MARIADB\",\"MARIADB_TO_CLIENT_EXPORT\",\"CLIENT_RETURN_TO_INTAKE\") NOT NULL,
              drive_file_id VARCHAR(128) NULL, workbook_name VARCHAR(255) NOT NULL,
              workbook_sha256 CHAR(64) NULL, source_sync_id CHAR(36) NULL,
              status ENUM(\"DISCOVERED\",\"DOWNLOADED\",\"VALIDATED\",\"REJECTED\",\"IMPORTED\",\"EXPORTED\",\"ARCHIVED\") NOT NULL DEFAULT \"DISCOVERED\",
              rows_written INT UNSIGNED NOT NULL DEFAULT 0, error_summary TEXT NULL,
              created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP, completed_at DATETIME NULL,
              KEY ix_cg_workbook_sha(workbook_sha256), KEY ix_cg_sync_direction_status(direction,status),
              CONSTRAINT fk_cg_sync_parent FOREIGN KEY(source_sync_id) REFERENCES cg_workbook_sync(sync_id)
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4");
          '
          install -m 0750 /tmp/sync_master_from_drive.php "$app/scripts/sync_master_from_drive.php"
          install -m 0750 /tmp/cosmos_master_import.php "$app/scripts/cosmos_master_import.php"
          php -l "$app/scripts/sync_master_from_drive.php"
          php -l "$app/scripts/cosmos_master_import.php"
          set +e
          php -d display_errors=1 -d log_errors=0 "$app/scripts/sync_master_from_drive.php" --private-root="$private" --download-only 2>&1
          download_code=$?
          if [ "$download_code" -eq 0 ]; then
            php -d display_errors=1 -d log_errors=0 "$app/scripts/cosmos_master_import.php" --workbook="$private/incoming/Saral_Pavan_Excel_Production_Master_v1.0.xlsx" --private-root="$private" 2>&1
            import_result=$?
            if [ "$import_result" -eq 0 ]; then
              SP_CONFIG="$private/config.php" php -r '
                $c=require getenv("SP_CONFIG");$d=$c["db"];
                if(($d["name"]??"")!=="u756742628_saralpavan") exit(51);
                $p=new PDO("mysql:host=".$d["host"].";dbname=".$d["name"].";charset=".($d["charset"]??"utf8mb4"),$d["user"],$d["pass"],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
                $tables=["sp_cosmos_source","sp_cosmos_unit","sp_cosmos_time_standard","sp_cosmos_reference_frame","sp_cosmos_object","sp_cosmos_constant","sp_cosmos_body_parameter","sp_cosmos_orbital_model","sp_cosmos_orbital_coefficient","sp_cosmos_equation","sp_cosmos_kernel_registry","sp_cosmos_body_shape","sp_cosmos_rotation_model","sp_cosmos_rotation_coefficient","sp_cosmos_rotation_periodic_coefficient","sp_cosmos_nutation_phase_angle_coefficient","sp_cosmos_bibliography","sp_cosmos_citation_policy","sp_cosmos_entity_citation","sp_cosmos_eop_record"];
                foreach($tables as $t){$n=(int)$p->query("SELECT COUNT(*) FROM `".$t."`")->fetchColumn();echo "live_count_".$t."=".$n."\n";}
                $orph=(int)$p->query("SELECT COUNT(*) FROM sp_cosmos_entity_citation c LEFT JOIN sp_cosmos_bibliography b ON b.bibliography_id=c.bibliography_id WHERE b.bibliography_id IS NULL")->fetchColumn();
                echo "orphan_citations=".$orph."\n";if($orph!==0)exit(52);
              '
            fi
          fi
          import_code=$?
          set -e
          echo "cosmos_import_exit_code=$import_code"
          rm -f /tmp/sync_master_from_drive.php /tmp/cosmos_master_import.php
          exit "$import_code"
          REMOTE
