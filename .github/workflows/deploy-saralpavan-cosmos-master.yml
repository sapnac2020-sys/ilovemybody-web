name: Deploy Saral Pavan Cosmos Master Bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-saralpavan-cosmos-master.yml"
      - ".github/saralpavan-deploy/**"
permissions:
  contents: read
concurrency:
  group: saralpavan-cosmos-master
  cancel-in-progress: false
jobs:
  deploy-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Hostinger SSH
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_BUNDLE"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -e '.host and .port and .user and .key' "$RUNNER_TEMP/deploy.json" >/dev/null
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
      - name: Prepare approved Saral Pavan bridge and migration
        run: |
          set -euo pipefail
          cp .github/saralpavan-deploy/sync_master_from_drive.php "$RUNNER_TEMP/sync_master_from_drive.php"
          cp .github/saralpavan-deploy/cosmos_master_import.php "$RUNNER_TEMP/cosmos_master_import.php"
          cp .github/saralpavan-deploy/018_batch_008.sql "$RUNNER_TEMP/018_batch_008.sql"
          php -l "$RUNNER_TEMP/sync_master_from_drive.php"
          php -l "$RUNNER_TEMP/cosmos_master_import.php"
      - name: Deploy, migrate, import and audit
        run: |
          set -euo pipefail
          ssh_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT")
          scp_args=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT")
          copied=false
          for attempt in 1 2 3 4 5; do
            if scp "${scp_args[@]}" "$RUNNER_TEMP/sync_master_from_drive.php" "$RUNNER_TEMP/cosmos_master_import.php" "$RUNNER_TEMP/018_batch_008.sql" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"; then copied=true; break; fi
            sleep 10
          done
          test "$copied" = true
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/domains/saralpavan.com/public_html"
          private="$HOME/domains/saralpavan.com/saralpavan_private"
          test -d "$app/scripts"
          test -s "$private/config.php"
          key_count="$(find "$private/credentials" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$key_count" = 1
          service_key="$(find "$private/credentials" -maxdepth 1 -type f -name '*.json' -print -quit)"
          SP_CONFIG="$private/config.php" SP_KEY="$service_key" php -r '
            $path=getenv("SP_CONFIG");$cfg=require $path;
            if(!is_array($cfg)||!isset($cfg["db"]))exit(31);
            $cfg["drive"]=["master_file_id"=>"1a2lEm-xtopkC5YCCEK6MTyq5YWXrXb-O","service_account_key"=>getenv("SP_KEY")];
            if(file_put_contents($path,"<?php\nreturn ".var_export($cfg,true).";\n")===false)exit(32);
          '
          chmod 600 "$private/config.php"
          SP_CONFIG="$private/config.php" SP_MIGRATION="/tmp/018_batch_008.sql" php -r '
            $c=require getenv("SP_CONFIG");$d=$c["db"];
            if(($d["name"]??"")!=="u756742628_saralpavan")exit(41);
            $p=new PDO("mysql:host=".$d["host"].";dbname=".$d["name"].";charset=".($d["charset"]??"utf8mb4"),$d["user"],$d["pass"],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
            $p->exec("CREATE TABLE IF NOT EXISTS cg_workbook_sync (sync_id CHAR(36) PRIMARY KEY,direction ENUM(\"DRIVE_TO_INTAKE\",\"INTAKE_TO_MARIADB\",\"MARIADB_TO_CLIENT_EXPORT\",\"CLIENT_RETURN_TO_INTAKE\") NOT NULL,drive_file_id VARCHAR(128) NULL,workbook_name VARCHAR(255) NOT NULL,workbook_sha256 CHAR(64) NULL,source_sync_id CHAR(36) NULL,status ENUM(\"DISCOVERED\",\"DOWNLOADED\",\"VALIDATED\",\"REJECTED\",\"IMPORTED\",\"EXPORTED\",\"ARCHIVED\") NOT NULL DEFAULT \"DISCOVERED\",rows_written INT UNSIGNED NOT NULL DEFAULT 0,error_summary TEXT NULL,created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,completed_at DATETIME NULL,KEY ix_cg_workbook_sha(workbook_sha256),KEY ix_cg_sync_direction_status(direction,status)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4");
            $sql=file_get_contents(getenv("SP_MIGRATION"));if($sql===false)exit(42);$p->exec($sql);
          '
          install -m 0750 /tmp/sync_master_from_drive.php "$app/scripts/sync_master_from_drive.php"
          install -m 0750 /tmp/cosmos_master_import.php "$app/scripts/cosmos_master_import.php"
          php -l "$app/scripts/sync_master_from_drive.php"
          php -l "$app/scripts/cosmos_master_import.php"
          php -d display_errors=1 -d log_errors=0 "$app/scripts/sync_master_from_drive.php" --private-root="$private" --download-only
          workbook="$private/incoming/Saral_Pavan_Excel_Production_Master_v1.0.xlsx"
          sha256sum "$workbook"
          php -d display_errors=1 -d log_errors=0 "$app/scripts/cosmos_master_import.php" --workbook="$workbook" --private-root="$private"
          SP_CONFIG="$private/config.php" php -r '
            $c=require getenv("SP_CONFIG");$d=$c["db"];$p=new PDO("mysql:host=".$d["host"].";dbname=".$d["name"].";charset=".($d["charset"]??"utf8mb4"),$d["user"],$d["pass"],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
            $expected=["sp_cosmos_horizons_request"=>11,"sp_cosmos_horizons_response"=>11,"sp_cosmos_ephemeris_state"=>33,"sp_cosmos_event_definition"=>12,"sp_cosmos_uncertainty_rule"=>12,"sp_cosmos_data_lineage"=>33,"sp_cosmos_validation_record"=>14];
            foreach($expected as $t=>$minimum){$n=(int)$p->query("SELECT COUNT(*) FROM `".$t."`")->fetchColumn();echo "live_count_".$t."=".$n."\n";if($n<$minimum)exit(51);}
            $bad=(int)$p->query("SELECT COUNT(*) FROM sp_cosmos_ephemeris_state WHERE source_id<>\"SRC-JPL-HORIZONS-API\" OR row_status<>\"RAW_SOURCE\"")->fetchColumn();echo "invalid_ephemeris_rows=".$bad."\n";if($bad!==0)exit(52);
          '
          rm -f /tmp/sync_master_from_drive.php /tmp/cosmos_master_import.php /tmp/018_batch_008.sql
          REMOTE
