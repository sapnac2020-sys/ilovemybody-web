name: Deploy psoriasis parameter readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [backend/phase_94_psoriasis_parameter_readiness.sql, ops/apply-psoriasis-parameter-readiness.php, .github/workflows/psoriasis-parameter-readiness.yml]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: php -l ops/apply-psoriasis-parameter-readiness.php
      - name: Prepare SSH
        env: {DEPLOY_BUNDLE: "${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}"}
        run: |
          set -euo pipefail; printf '%s' "$DEPLOY_BUNDLE" | base64 --decode >"$RUNNER_TEMP/d.json"; mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"; jq -r '.key' "$RUNNER_TEMP/d.json" >"$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          echo "H=$(jq -r '.host' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; echo "P=$(jq -r '.port' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; echo "U=$(jq -r '.user' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; ssh-keyscan -p "$(jq -r '.port' "$RUNNER_TEMP/d.json")" "$(jq -r '.host' "$RUNNER_TEMP/d.json")" >>"$HOME/.ssh/known_hosts"
      - name: Apply and verify
        run: |
          set -euo pipefail; scp -i "$HOME/.ssh/id_ed25519" -P "$P" backend/phase_94_psoriasis_parameter_readiness.sql ops/apply-psoriasis-parameter-readiness.php "$U@$H:/tmp/"; set +e
          ssh -i "$HOME/.ssh/id_ed25519" -p "$P" "$U@$H" "php /tmp/apply-psoriasis-parameter-readiness.php \"\$HOME/domains/ilovemybody.in/ilmb-config.php\" /tmp/phase_94_psoriasis_parameter_readiness.sql" >"$RUNNER_TEMP/p94.json" 2>"$RUNNER_TEMP/p94.err"; rc=$?; set -e
          if [ "$rc" -ne 0 ]; then err="$(tail -c 3000 "$RUNNER_TEMP/p94.json"; tail -c 3000 "$RUNNER_TEMP/p94.err")"; jq -n --arg error "$err" --argjson exit_code "$rc" '{phase:"P94_PARAMETER_IDENTIFIABILITY_AND_DECISION_GATE",verified:false,exit_code:$exit_code,error:$error,patient_tables_queried:false,patient_rows_read:0,patient_rows_modified:0}' >"$RUNNER_TEMP/proof.json"; exit "$rc"; fi
          jq -e '.resolution_plan_count==10 and .decision_rule_count==5 and .open_execution_parameters==10 and .experiment_executable==false and .clinical_dose_conversions==0 and .invented_coefficients==0 and .patient_experiment_required==false and .verified==true' "$RUNNER_TEMP/p94.json" >/dev/null; cp "$RUNNER_TEMP/p94.json" "$RUNNER_TEMP/proof.json"
      - name: Publish proof
        if: always()
        run: |
          set -euo pipefail; test -f "$RUNNER_TEMP/proof.json"; mkdir -p proofs; cp "$RUNNER_TEMP/proof.json" proofs/psoriasis-parameter-readiness-latest.json; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add proofs/psoriasis-parameter-readiness-latest.json
          if git diff --cached --quiet; then exit 0; fi; git commit -m "proof: verify psoriasis parameter readiness [skip ci]"; git push origin HEAD:main
