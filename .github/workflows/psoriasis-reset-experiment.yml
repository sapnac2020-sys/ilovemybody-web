name: Deploy psoriasis reset experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [backend/phase_92_psoriasis_reset_experiment.sql, ops/apply-psoriasis-reset-experiment.php, ops/calculate-psoriasis-reset-experiment.php, .github/workflows/psoriasis-reset-experiment.yml]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: php -l ops/apply-psoriasis-reset-experiment.php && php -l ops/calculate-psoriasis-reset-experiment.php
      - name: Test calculator
        run: |
          echo '{"arm":"TEST","stage":"TEST","measurements":{"P":{"X":5,"H":0,"P":10},"D":{"X":5,"H":0,"P":10},"B":{"X":5,"H":0,"P":10},"I":{"X":5,"H":0,"P":10},"R":{"X":5,"H":0,"P":10}}}' >"$RUNNER_TEMP/input.json"
          php ops/calculate-psoriasis-reset-experiment.php "$RUNNER_TEMP/input.json" | jq -e '[.normalised_states[].N] | all(. == 0.5)' >/dev/null
      - name: Prepare SSH
        env: {DEPLOY_BUNDLE: "${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}"}
        run: |
          set -euo pipefail; printf '%s' "$DEPLOY_BUNDLE" | base64 --decode >"$RUNNER_TEMP/d.json"; mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"; jq -r '.key' "$RUNNER_TEMP/d.json" >"$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          echo "H=$(jq -r '.host' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; echo "P=$(jq -r '.port' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; echo "U=$(jq -r '.user' "$RUNNER_TEMP/d.json")" >>"$GITHUB_ENV"; ssh-keyscan -p "$(jq -r '.port' "$RUNNER_TEMP/d.json")" "$(jq -r '.host' "$RUNNER_TEMP/d.json")" >>"$HOME/.ssh/known_hosts"
      - name: Apply and verify
        run: |
          set -euo pipefail; scp -i "$HOME/.ssh/id_ed25519" -P "$P" backend/phase_92_psoriasis_reset_experiment.sql ops/apply-psoriasis-reset-experiment.php ops/calculate-psoriasis-reset-experiment.php "$U@$H:/tmp/"; set +e
          ssh -i "$HOME/.ssh/id_ed25519" -p "$P" "$U@$H" "php /tmp/apply-psoriasis-reset-experiment.php \"\$HOME/domains/ilovemybody.in/ilmb-config.php\" /tmp/phase_92_psoriasis_reset_experiment.sql" >"$RUNNER_TEMP/p92.json" 2>"$RUNNER_TEMP/p92.err"; rc=$?; set -e
          if [ "$rc" -ne 0 ]; then err="$(tail -c 3000 "$RUNNER_TEMP/p92.json"; tail -c 3000 "$RUNNER_TEMP/p92.err")"; jq -n --arg error "$err" --argjson exit_code "$rc" '{phase:"P92_RESET_EXPERIMENT_SPECIFICATION",verified:false,exit_code:$exit_code,error:$error,patient_tables_queried:false,patient_rows_read:0,patient_rows_modified:0}' >"$RUNNER_TEMP/proof.json"; exit "$rc"; fi
          jq -e '.arm_count==6 and .stage_count==5 and .formula_count==4 and .wetlab_measurements_loaded==0 and .verified==true' "$RUNNER_TEMP/p92.json" >/dev/null; cp "$RUNNER_TEMP/p92.json" "$RUNNER_TEMP/proof.json"
      - name: Publish proof
        if: always()
        run: |
          set -euo pipefail; test -f "$RUNNER_TEMP/proof.json"; mkdir -p proofs; cp "$RUNNER_TEMP/proof.json" proofs/psoriasis-reset-experiment-latest.json; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add proofs/psoriasis-reset-experiment-latest.json
          if git diff --cached --quiet; then exit 0; fi; git commit -m "proof: verify psoriasis reset experiment [skip ci]"; git push origin HEAD:main
