name: Establish acupuncture correlation ledger
on:
  push:
    branches: [main]
    paths:
      - backend/phase_71_acupuncture_correlation_ledger.sql
      - ops/run-acupuncture-correlation-ledger.php
      - .github/workflows/establish-acupuncture-correlation-ledger.yml
  workflow_dispatch:
jobs:
  establish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: establish ledger
        env: {DEPLOY_BUNDLE: "${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}"}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; printf '%s' "$DEPLOY_BUNDLE"|base64 --decode >/tmp/d.json
          jq -r .key /tmp/d.json >"$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          h="$(jq -r .host /tmp/d.json)"; p="$(jq -r .port /tmp/d.json)"; u="$(jq -r .user /tmp/d.json)"
          ssh-keyscan -T 10 -t ed25519 -p "$p" "$h" >>"$HOME/.ssh/known_hosts"
          w="/tmp/acupuncture-ledger-${GITHUB_RUN_ID}"
          for n in 1 2 3; do
            if tar -czf - backend/phase_71_acupuncture_correlation_ledger.sql ops/run-acupuncture-correlation-ledger.php | ssh -i "$HOME/.ssh/id_ed25519" -p "$p" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 "$u@$h" "mkdir -p '$w' && tar -xzf - -C '$w' && php '$w/ops/run-acupuncture-correlation-ledger.php' '/home/$u/domains/ilovemybody.in/ilmb-config.php' '$w/backend/phase_71_acupuncture_correlation_ledger.sql'"; then
              break
            fi
            test "$n" = 3 && exit 1
            sleep 8
          done
