name: Audit live lab correlation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ops/audit-lab-correlation.php
      - .github/workflows/audit-lab-correlation.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: php -l ops/audit-lab-correlation.php
      - name: Prepare SSH
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > /tmp/d.json
          jq -r '.key' /tmp/d.json > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' /tmp/d.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' /tmp/d.json)" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' /tmp/d.json)" >> "$GITHUB_ENV"
          ssh-keyscan -p "$(jq -r '.port' /tmp/d.json)" "$(jq -r '.host' /tmp/d.json)" >> "$HOME/.ssh/known_hosts"
      - name: Run read-only live audit
        run: |
          set -euo pipefail
          remote="/tmp/audit-lab-${GITHUB_RUN_ID}.php"
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" ops/audit-lab-correlation.php "$DEPLOY_USER@$DEPLOY_HOST:$remote"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "php '$remote' \"\$HOME/domains/ilovemybody.in/ilmb-config.php\"; rm -f '$remote'" | tee "$RUNNER_TEMP/lab-audit.json"
          jq -e '.patient_rows_read==0 and .patient_rows_modified==0' "$RUNNER_TEMP/lab-audit.json" >/dev/null
