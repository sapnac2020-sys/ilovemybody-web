name: Hard Delete Confirmed Duplicate Stage Files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hard-delete-duplicate-stage-folder.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          DEPLOY_BUNDLE: ${{ secrets.HOSTINGER_DEPLOY_BUNDLE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_BUNDLE" | base64 --decode > "$RUNNER_TEMP/deploy.json"
          jq -r '.key' "$RUNNER_TEMP/deploy.json" > "$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          echo "DEPLOY_HOST=$(jq -r '.host' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$(jq -r '.port' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$(jq -r '.user' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_ENV"
          cat > "$HOME/.ssh/config" <<'SSHCONFIG'
          Host *
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
            IdentitiesOnly yes
          SSHCONFIG
          chmod 600 "$HOME/.ssh/config"
      - name: Hard delete only byte-identical staged files
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domains/ilovemybody.in/public_html"
          STAGE="$BASE/stage-1e30f23f840711ed53f7"
          APP="$BASE/app"
          if [ ! -d "$STAGE" ]; then
            echo '{"stage_folder":"already_absent","duplicates_deleted":0,"unique_retained":0}'
            exit 0
          fi
          list="/tmp/ilmb-stage-files-$$.txt"
          find "$STAGE" -type f -print > "$list"
          deleted=0
          retained=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rel="${f#$STAGE/}"
            target="$APP/$rel"
            if [ -f "$target" ]; then
              a=$(sha256sum "$f" | awk '{print $1}')
              b=$(sha256sum "$target" | awk '{print $1}')
              if [ "$a" = "$b" ]; then
                rm -f "$f"
                deleted=$((deleted+1))
                echo "DELETED_DUPLICATE:$rel"
                continue
              fi
            fi
            retained=$((retained+1))
            echo "RETAINED_UNIQUE:$rel"
          done < "$list"
          rm -f "$list"
          find "$STAGE" -depth -type d -empty -delete || true
          if [ -d "$STAGE" ] && [ -z "$(find "$STAGE" -mindepth 1 -print -quit)" ]; then rmdir "$STAGE"; fi
          printf '{"duplicates_deleted":%s,"unique_retained":%s,"stage_folder_remaining":%s}\n' "$deleted" "$retained" "$([ -d "$STAGE" ] && echo true || echo false)"
          REMOTE
