<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ILMB Food Nutrient Proof</title><style>body{font:16px system-ui;background:#f8fff7;color:#172116;margin:0}.wrap{max-width:980px;margin:auto;padding:36px}.card{background:#fff;border:1px solid #dbead7;border-radius:20px;padding:24px;margin:18px 0}h1{font:600 40px Georgia}form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:grid;gap:6px;font-size:13px}input{padding:12px;border:1px solid #b9ccb5;border-radius:10px}button{grid-column:1/-1;padding:13px;border:0;border-radius:12px;background:#287a3d;color:#fff;font-weight:700}pre{white-space:pre-wrap;word-break:break-word;background:#122015;color:#fff;padding:20px;border-radius:14px}@media(max-width:700px){form{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p>ILMB · GOVERNED COMPUTATION</p><h1>Food → nutrient proof</h1><p>Exact IFCT identifiers and source composition values only. No patient data and no guessed ChEBI mapping.</p><section class="card"><form id="f"><label>Food ID<input name="food" value="ifct_a001"></label><label>Nutrient ID<input name="nutrient" value="al"></label><label>Portion (g)<input name="portion_g" value="30"></label><button>Run governed calculation</button></form></section><section class="card"><pre id="out">Run the proof.</pre></section></main><script>f.onsubmit=async e=>{e.preventDefault();out.textContent='Checking…';try{const r=await fetch('food-nutrient.php?'+new URLSearchParams(new FormData(e.target)));out.textContent=JSON.stringify(await r.json(),null,2)}catch(x){out.textContent='Unable to read the response.'}};</script></body></html>
