<style>
:root{--pink:#ff8fc7;--cyan:#79deef;--white:#fff;--rail:#0a0c1a}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#111;color:#fff;font-family:Inter,Arial,sans-serif}
.lobby{position:fixed;inset:0;background:url('/assets/hospital-lobby-final.jpg?v=20260723-423') center/cover no-repeat}
.rail{position:fixed;z-index:5;left:18px;top:18px;bottom:18px;width:62px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;border:1px solid rgba(139,151,194,.28);border-radius:34px;background:rgba(7,8,20,.86);box-shadow:inset 0 0 22px rgba(0,0,0,.25);backdrop-filter:blur(15px)}
.rail:before{content:'';position:absolute;top:26px;bottom:26px;left:50%;width:1px;background:rgba(132,141,177,.14);transform:translateX(-50%);z-index:-1}
.tab{position:relative;width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(139,151,194,.25);background:#090b1c;color:#8991a7;transition:.2s}
.tab:hover{color:#fff;border-color:rgba(255,143,199,.65)}.tab.active{color:#211325;background:var(--pink);border-color:var(--pink);box-shadow:0 0 22px rgba(255,143,199,.25)}.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.tab span{position:absolute;left:calc(100% + 13px);white-space:nowrap;padding:7px 12px;border:1px solid rgba(255,143,199,.3);border-radius:99px;background:rgba(12,8,17,.94);color:#fff;font-size:10px;opacity:0;visibility:hidden;transform:translateX(-5px);transition:.18s}.tab:hover span{opacity:1;visibility:visible;transform:none}
@media(max-width:700px){.lobby{background-position:center top}.rail{left:0;right:0;top:auto;bottom:0;width:100%;height:62px;flex-direction:row;border:0;border-radius:0;padding:5px 8px}.rail:before,.tab span,.tab:nth-child(n+7){display:none}.tab{width:40px;height:40px;flex-basis:40px}}
</style>
